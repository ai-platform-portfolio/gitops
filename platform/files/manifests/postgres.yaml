apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: platform-daily
  namespace: postgres
spec:
  schedule: 0 0 2 * * *
  immediate: true
  backupOwnerReference: cluster
  cluster:
    name: platform
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups
  namespace: postgres
spec:
  configuration:
    destinationPath: https://{{ required "runtime.AZURE_STORAGE_ACCOUNT is required" .Values.runtime.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/{{ required "runtime.STORAGE_POSTGRES is required" .Values.runtime.STORAGE_POSTGRES }}/archive
    azureCredentials:
      inheritFromAzureAD: true
    data:
      compression: gzip
      jobs: 2
    wal:
      compression: gzip
      maxParallel: 4
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform
  namespace: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  enableSuperuserAccess: false
  certificates:
    serverAltDNSNames:
    - platform-pooler
    - platform-pooler.postgres
    - platform-pooler.postgres.svc
    - platform-pooler.postgres.svc.cluster.local
{{- if .Values.sonarqubeReady }}
  managed:
    roles:
    - name: sonarqube
      ensure: present
      login: true
      superuser: false
      createdb: false
      createrole: false
      replication: false
      passwordSecret:
        name: sonarqube-role
{{- end }}
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  inheritedMetadata:
    labels:
      azure.workload.identity/use: 'true'
  serviceAccountTemplate:
    metadata:
      annotations:
        azure.workload.identity/client-id: {{ required "runtime.POSTGRES_AZURE_CLIENT_ID is required" .Values.runtime.POSTGRES_AZURE_CLIENT_ID }}
        azure.workload.identity/tenant-id: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID }}
  bootstrap:
    initdb:
      database: app
      owner: app
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: backups
      serverName: platform
  storage:
    storageClass: postgres-premium
    size: 32Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  postgresql:
    parameters:
      max_connections: '200'
      shared_buffers: 256MB
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.2
      archive_timeout: 60s
    pg_hba:
    - hostnossl all all all reject
    - hostssl app app all scram-sha-256
    - hostssl sonarqube sonarqube all scram-sha-256
    - host all all all reject
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: postgres-premium
provisioner: disk.csi.azure.com
parameters:
  skuName: Premium_LRS
  cachingMode: None
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: platform-pooler
  namespace: postgres
spec:
  cluster:
    name: platform
  instances: 1
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: '500'
      default_pool_size: '20'
      reserve_pool_size: '5'
      max_db_connections: '80'
      client_tls_sslmode: require
  template:
    metadata:
      labels:
        app: platform-pooler
    spec:
      containers:
      - name: pgbouncer
        image: ghcr.io/cloudnative-pg/pgbouncer:1.26.0
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: platform-pooler
            topologyKey: kubernetes.io/hostname
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-internal
  namespace: postgres
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sonarqube
      podSelector:
        matchLabels:
          app: sonarqube
          release: sonarqube
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: platform
    - podSelector:
        matchLabels:
          app: platform-pooler
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9187
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
  - ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      app: platform-pooler
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          gitops.platform/postgres-client: 'true'
      podSelector:
        matchLabels:
          gitops.platform/postgres-client: 'true'
    ports:
    - protocol: TCP
      port: 5432

{{- if .Values.sonarqubeReady }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: sonarqube
  namespace: postgres
spec:
  name: sonarqube
  owner: sonarqube
  cluster:
    name: platform
  databaseReclaimPolicy: retain
{{- end }}
