# Start cert-manager after Envoy installs Gateway API CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  source:
    repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: "v1.21.2"
    helm:
      releaseName: cert-manager
      valuesObject:
{{ tpl (.Files.Get "packages/cert-manager/values.yaml") . | indent 8 }}

{{ include "platform.syncPolicy" . | indent 2 }}
