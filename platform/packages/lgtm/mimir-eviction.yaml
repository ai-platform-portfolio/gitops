apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: pod-eviction-lgtm
  labels:
    grafana.com/inject-rollout-operator-ca: 'true'
    grafana.com/namespace: lgtm
    helm.sh/chart: rollout-operator-0.50.1
    app.kubernetes.io/name: rollout-operator
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/version: v0.38.1
    app.kubernetes.io/managed-by: Helm
webhooks:
- name: pod-eviction-lgtm.grafana.com
  clientConfig:
    service:
      namespace: lgtm
      name: mimir-rollout-operator
      path: /admission/pod-eviction
      port: 443
  rules:
  - operations:
    - CREATE
    apiGroups:
    - ''
    apiVersions:
    - v1
    resources:
    - pods/eviction
    scope: Namespaced
  admissionReviewVersions:
  - v1
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: lgtm
  sideEffects: None
  timeoutSeconds: 10
  failurePolicy: Ignore
