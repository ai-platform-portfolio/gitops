# Terraform owns ArgoCD; configuration lives in argocd-configmap.yaml.
fullnameOverride: argocd

global:
  networkPolicy:
    create: false

server:
  replicas: 1
  service:
    type: ClusterIP
repoServer:
  replicas: 1
applicationSet:
  replicas: 1
controller:
  replicas: 1

  # Temporary upstream backports; remove after adopting releases with both fixes.
  image:
    repository: localacrk8s.azurecr.io/platform/argocd
    tag: preview-argocd-v3.5.5-ai167-335527a924e088420f15b501ec4750f2f4d4b8cb@sha256:66750b523da747958c91c8776985fd77860dee1f6483be974a9164f8f6072ead

  env:
    # WATCH bypasses client-go QPS limiting; the pinned backport adds backoff/jitter.
    - name: ARGOCD_CLUSTER_CACHE_WATCH_RETRY_USE_BACKOFF
      value: "true"

    # Bound initial/recovery LIST bursts; upstream defaults to 50 concurrent lists.
    - name: ARGOCD_CLUSTER_CACHE_LIST_SEMAPHORE
      value: "5"

configs:
  params:
    # Envoy terminates public HTTPS; Argo stays on its ClusterIP service.
    server.insecure: true

    # Ask the API server to predict defaults when comparing desired/live state.
    controller.diff.server.side: true

  cm:
    create: false

  rbac:
    # Terraform fills the group ID from the group module output.
    # Authentication alone grants no application permissions.
    policy.default: ""
    policy.csv: |
      g, ${admin_group_id}, role:admin
    scopes: '[groups]'
