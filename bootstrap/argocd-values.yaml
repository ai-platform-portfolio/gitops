# Terraform owns ArgoCD; configuration lives in argocd-configmap.yaml.
fullnameOverride: argocd

global:
  networkPolicy:
    create: false

server:
  replicas: 1
  service:
    type: ClusterIP
repoServer:
  replicas: 1

  podLabels:
    azure.workload.identity/use: "true"
  annotations:
    configmap.reloader.stakater.com/reload: argocd-registry-identity
  env:
    - name: AZURE_CLIENT_ID
      valueFrom:
        configMapKeyRef:
          name: argocd-registry-identity
          key: clientId
          # Public Git must work before GitOps/ASO exports the registry identity.
          optional: true

applicationSet:
  replicas: 1
controller:
  replicas: 1

  # Temporary delete-hook race fix; remove after adopting a fixed upstream release.
  image:
    repository: localacrk8s.azurecr.io/platform/argocd
    tag: argocd-v3.5.5-ai116-ff239df2939c83920eba012356bb9497aff35805@sha256:ffa04c5aa5dc5dc536ac0f0bdd386762a8e2a778bb51ad3b35adf889106b8669

configs:
  params:
    # Envoy terminates public HTTPS; Argo stays on its ClusterIP service.
    server.insecure: true

    # Ask the API server to predict defaults when comparing desired/live state.
    controller.diff.server.side: true

  cm:
    create: false

  rbac:
    # Terraform fills the group ID from the group module output.
    # Authentication alone grants no application permissions.
    policy.default: ""
    policy.csv: |
      g, ${admin_group_id}, role:admin
    scopes: '[groups]'
