# Terraform owns ArgoCD; configuration lives in argocd-configmap.yaml.
fullnameOverride: argocd
server:
  replicas: 1
  service:
    type: ClusterIP
repoServer:
  replicas: 1
applicationSet:
  replicas: 1
controller:
  replicas: 1
configs:
  params:
    # Envoy terminates public HTTPS; Argo stays on its ClusterIP service.
    server.insecure: true

  cm:
    create: false
