apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cluster-onboarding-writer
  namespace: cluster-onboarding
spec:
  provider:
    azurekv:
      vaultUrl: {{ required "shared.vaultUri is required" .Values.shared.vaultUri | quote }}
      tenantId: {{ required "shared.tenantId is required" .Values.shared.tenantId | quote }}
      authType: WorkloadIdentity
      serviceAccountRef:
        name: cluster-onboarding
