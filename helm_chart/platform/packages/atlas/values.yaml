# The bot token is delivered from Azure Key Vault by External Secrets.
prewarmDevDB: false
allowCustomConfig: true
watchNamespaces: [atlas-system]

extraEnvs:
  - name: ATLAS_TOKEN
    valueFrom:
      secretKeyRef:
        name: atlas-token-secret
        key: ATLAS_TOKEN

# Resource Secret references use the named Role in database-access.yaml.
# Keep Secret discovery/watches disabled rather than granting namespace-wide reads.
rbac:
  clusterWideSecretAccess: false
watchSecrets: false

extraVolumes:
  - name: postgres-ca
    secret:
      secretName: atlas-postgres
      # Atlas runs unprivileged; the chart's fsGroup can read a root-owned key
      # with 0640 permissions. No subPath: renewed files update in the mounted dir.
      defaultMode: 0640
      items:
        - {key: ca.crt, path: ca.crt}
        - {key: tls.crt, path: tls.crt}
        - {key: tls.key, path: tls.key}

extraVolumeMounts:
  - name: postgres-ca
    mountPath: /etc/atlas-postgres
    readOnly: true

# Set security on the container: the chart defaults fsGroup and skips pod settings.
# Argo valuesObject omits null values, so a null fsGroup override is unreliable.
containerSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
