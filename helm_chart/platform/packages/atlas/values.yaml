# The bot token is delivered from Azure Key Vault by External Secrets.
prewarmDevDB: false
allowCustomConfig: false
watchNamespaces: [atlas-system]

extraEnvs:
  - name: ATLAS_TOKEN
    valueFrom:
      secretKeyRef:
        name: atlas-token-secret
        key: ATLAS_TOKEN

# The operator consumes its token as an environment variable. Future Atlas
# resources need separately scoped Secret access for database credentials.
rbac:
  clusterWideSecretAccess: false
watchSecrets: false

# Set security on the container: the chart defaults fsGroup and skips pod settings.
# Argo valuesObject omits null values, so a null fsGroup override is unreliable.
containerSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
