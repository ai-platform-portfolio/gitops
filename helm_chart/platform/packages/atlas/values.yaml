# Free/basic operator only: no Atlas Cloud token or paid features.
prewarmDevDB: false
allowCustomConfig: false
watchNamespaces: [atlas-system]

# No cross-namespace credential access for this idle installation.
rbac:
  clusterWideSecretAccess: false
watchSecrets: false

# Set security on the container: the chart defaults fsGroup and skips pod settings.
# Argo valuesObject omits null values, so a null fsGroup override is unreliable.
containerSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
