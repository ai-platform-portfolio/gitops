# Free/basic operator only: no Atlas Cloud token or paid features.
prewarmDevDB: false
allowCustomConfig: false
watchNamespaces: [atlas-system]

# No cross-namespace credential access for this idle installation.
rbac:
  clusterWideSecretAccess: false
watchSecrets: false

# Keep security on the container: Argo removes null Helm values before rendering.
persistence:
  enabled: false

containerSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
