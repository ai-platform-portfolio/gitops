apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-token-secret
  namespace: atlas-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: atlas-token-secret
  data:
    - secretKey: ATLAS_TOKEN
      remoteRef:
        key: ai-platform-portfolio-atlas-bot
