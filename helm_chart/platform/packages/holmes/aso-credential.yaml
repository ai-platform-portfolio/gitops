apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-aso-credential
  namespace: holmes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: aso-credential
    template:
      data:
        AZURE_CLIENT_ID: '{{ "{{ .clientId }}" }}'
        AZURE_TENANT_ID: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | quote }}
        AZURE_SUBSCRIPTION_ID: {{ required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID | quote }}
        USE_WORKLOAD_IDENTITY_AUTH: "true"
  data:
    - secretKey: clientId
      remoteRef:
        key: {{ .Values.holmes.azure.asoClientIdSecret | quote }}
