replicas: 1

createServiceAccount: false
customServiceAccountName: holmes
k8sRBAC: false

enableTelemetry: false
sentryDSN: ""

operator:
  enabled: false

modelList:
  approved:
    model: {{ .Values.holmes.model | quote }}
    api_base: {{ .Values.holmes.modelEndpoint | quote }}
{{- if .Values.holmes.modelApiVersion }}
    api_version: {{ .Values.holmes.modelApiVersion | quote }}
{{- end }}
    api_key: envRef:HOLMES_MODEL_API_KEY

extraEnvVarsSecrets:
  - holmes-model
  - holmes-api-token

additionalEnvVars:
  - name: MODEL
    value: approved

toolsets:
  kubernetes/core:
    enabled: true
  kubernetes/logs:
    enabled: true
  prometheus/metrics:
    enabled: true
    config:
      prometheus_url: http://mimir-gateway.lgtm.svc.cluster.local/prometheus
  grafana/loki:
    enabled: true
    config:
      api_url: http://loki-gateway.lgtm.svc.cluster.local
  grafana/tempo:
    enabled: true
    config:
      api_url: http://tempo.lgtm.svc.cluster.local:3200
  robusta:
    enabled: false
  internet:
    enabled: false
  bash:
    enabled: false
  skills:
    enabled: false
  connectivity_check:
    enabled: false

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
