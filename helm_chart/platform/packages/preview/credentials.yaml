# Stable, disposable source passwords. CNPG does not reconcile these SQL roles.
{{- range $name := list "preview-manual-migrator" "preview-manual-runtime" }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}
  namespace: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-35"}
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-35"}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $name }}
    creationPolicy: Orphan
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: atlas-system
  annotations: {argocd.argoproj.io/sync-wave: "-30"}
spec:
  refreshInterval: 1m
  secretStoreRef: {name: atlas-postgres, kind: SecretStore}
  target: {name: {{ $name }}}
  data:
    - secretKey: password
      remoteRef: {key: {{ $name }}, property: password}

---
{{- end }}
# Extend only the existing ESO reader's named password access, not Atlas itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-manual-atlas-reader
  namespace: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-34"}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [preview-manual-migrator, preview-manual-runtime]
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-manual-atlas-reader
  namespace: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-34"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: preview-manual-atlas-reader}
subjects:
  - {kind: ServiceAccount, name: atlas-secret-reader, namespace: atlas-system}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-secret-reader
  namespace: preview-manual
  annotations: {argocd.argoproj.io/sync-wave: "-34"}
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-manual-runtime-reader
  namespace: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-34"}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [preview-manual-runtime, platform-ca]
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-manual-runtime-reader
  namespace: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-34"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: preview-manual-runtime-reader}
subjects:
  - {kind: ServiceAccount, name: preview-secret-reader, namespace: preview-manual}

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: preview-postgres
  namespace: preview-manual
  annotations: {argocd.argoproj.io/sync-wave: "-33"}
spec:
  provider:
    kubernetes:
      remoteNamespace: postgres
      server:
        url: https://kubernetes.default.svc
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt}
      auth:
        serviceAccount: {name: preview-secret-reader}

---
# Deliver only runtime credentials and the public CA to the application namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: preview-database
  namespace: preview-manual
  annotations: {argocd.argoproj.io/sync-wave: "-30"}
spec:
  refreshInterval: 1m
  secretStoreRef: {name: preview-postgres, kind: SecretStore}
  target:
    name: preview-database
    template:
      engineVersion: v2
      data:
        url: 'postgres://preview_manual_app:{{ "{{ .password }}" }}@platform-rw.postgres.svc.cluster.local:5432/preview_manual?sslmode=verify-full&sslrootcert=/etc/postgres/ca.crt'
        ca.crt: '{{ "{{ index . \"ca.crt\" }}" }}'
  data:
    - secretKey: password
      remoteRef: {key: preview-manual-runtime, property: password}
    - secretKey: ca.crt
      remoteRef: {key: platform-ca, property: ca.crt}
