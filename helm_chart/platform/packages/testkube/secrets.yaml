apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: testkube-database-password
  namespace: postgres

spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: testkube-role
  namespace: postgres

spec:
  refreshPolicy: CreatedOnce
  target:
    name: testkube-role
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        username: testkube
        password: '{{ "{{ .password }}" }}'
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: 'true'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: testkube-database-password

---

apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: testkube-storage-password
  namespace: testkube

spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: testkube-storage
  namespace: testkube

spec:
  refreshPolicy: CreatedOnce
  target:
    name: testkube-storage
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        accessKey: testkube
        secretKey: '{{ "{{ .password }}" }}'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: testkube-storage-password

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: testkube-tests
  namespace: testkube

automountServiceAccountToken: false

---

# No separate Key Vault provisioning is needed for ASO's initial authority.
apiVersion: v1
kind: Secret
metadata:
  name: aso-credential
  namespace: testkube

type: Opaque

stringData:
  AZURE_CLIENT_ID: {{ required "runtime.ASO_CLIENT_ID is required" .Values.runtime.ASO_CLIENT_ID | quote }}
  AZURE_TENANT_ID: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | quote }}
  AZURE_SUBSCRIPTION_ID: {{ required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID | quote }}
  USE_WORKLOAD_IDENTITY_AUTH: "true"
