# Reserved installation checks; application test definitions belong to applications.
apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: platform-storage-smoke
  namespace: testkube

spec:
  config:
    candidateUrl:
      type: string
  steps:
    - name: Verify candidate and persist an artifact
      run:
        image: docker.io/kubeshop/testkube-cli:2.14.2@sha256:1ee9228907b31d6fb901b0683237797aa107ed73915504ac8a547de01681f9b7
        shell: |
          set -eu
          wget -q -O /data/health.json '{{ "{{config.candidateUrl}}" }}/health'
          test -s /data/health.json
          printf '%s\n' 'testkube-azure-artifact-roundtrip' > /data/proof.txt
    - name: Store proof
      artifacts:
        paths: [/data/proof.txt]

---

apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: platform-failure-smoke
  namespace: testkube

spec:
  steps:
    - name: Deliberate failure
      run:
        image: docker.io/kubeshop/testkube-cli:2.14.2@sha256:1ee9228907b31d6fb901b0683237797aa107ed73915504ac8a547de01681f9b7
        shell: exit 7
