apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: testkube-internal
  namespace: testkube

spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: testkube-api-clients
  namespace: testkube

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          gitops.platform/testkube-client: 'true'
      podSelector:
        matchLabels:
          gitops.platform/testkube-client: 'true'
    ports:
    - protocol: TCP
      port: 8088
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8088
