# Early configuration: generated credentials, internal TLS and private networking.
# Public ListenerSet certificate automation does not supply NATS client mTLS.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: testkube-database-password
  namespace: postgres

spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: testkube-role
  namespace: postgres

spec:
  refreshPolicy: CreatedOnce
  target:
    name: testkube-role
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        username: testkube
        password: '{{ "{{ .password }}" }}'
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: 'true'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: testkube-database-password

---

# AWSv4 frontend credential; the Azure backend uses workload identity.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: testkube-storage-password
  namespace: testkube

spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: testkube-storage
  namespace: testkube

spec:
  refreshPolicy: CreatedOnce
  target:
    name: testkube-storage
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        accessKey: testkube
        secretKey: '{{ "{{ .password }}" }}'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: testkube-storage-password

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: testkube-tests
  namespace: testkube

automountServiceAccountToken: false

---

# No separate Key Vault provisioning is needed for ASO's initial authority.
apiVersion: v1
kind: Secret
metadata:
  name: aso-credential
  namespace: testkube

type: Opaque

stringData:
  AZURE_CLIENT_ID: {{ required "runtime.ASO_CLIENT_ID is required" .Values.runtime.ASO_CLIENT_ID | quote }}
  AZURE_TENANT_ID: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | quote }}
  AZURE_SUBSCRIPTION_ID: {{ required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID | quote }}
  USE_WORKLOAD_IDENTITY_AUTH: "true"

---

# Private PKI for NATS mutual TLS and the S3Proxy PKCS12 keystore.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: testkube-selfsigned
  namespace: testkube

spec:
  selfSigned: {}

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testkube-ca
  namespace: testkube

spec:
  isCA: true
  commonName: testkube-internal-ca
  secretName: testkube-ca
  duration: 87600h
  renewBefore: 720h
  issuerRef:
    name: testkube-selfsigned

---

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: testkube-ca
  namespace: testkube

spec:
  ca:
    secretName: testkube-ca

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testkube-nats
  namespace: testkube

spec:
  secretName: testkube-nats
  duration: 2160h
  renewBefore: 360h
  dnsNames:
  - testkube-nats
  - testkube-nats.testkube.svc.cluster.local
  usages:
  - server auth
  issuerRef:
    name: testkube-ca

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testkube-nats-client
  namespace: testkube

spec:
  secretName: testkube-nats-client
  duration: 2160h
  renewBefore: 360h
  dnsNames:
  - testkube-api
  usages:
  - client auth
  issuerRef:
    name: testkube-ca

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testkube-s3
  namespace: testkube

spec:
  secretName: testkube-s3
  duration: 2160h
  renewBefore: 360h
  dnsNames:
  - testkube-s3
  - testkube-s3.testkube.svc.cluster.local
  usages:
  - server auth
  issuerRef:
    name: testkube-ca
  keystores:
    pkcs12:
      create: true
      profile: Modern2023
      passwordSecretRef:
        name: testkube-storage
        key: secretKey

---

# Restrict inbound access to trusted test and monitoring clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: testkube-internal
  namespace: testkube

spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: testkube-api-clients
  namespace: testkube

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          gitops.platform/testkube-client: 'true'
      podSelector:
        matchLabels:
          gitops.platform/testkube-client: 'true'
    ports:
    - protocol: TCP
      port: 8088
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8088
