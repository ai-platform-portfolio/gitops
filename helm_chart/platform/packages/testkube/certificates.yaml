apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: testkube-selfsigned
  namespace: testkube

spec:
  selfSigned: {}

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testkube-ca
  namespace: testkube

spec:
  isCA: true
  commonName: testkube-internal-ca
  secretName: testkube-ca
  duration: 87600h
  renewBefore: 720h
  issuerRef:
    name: testkube-selfsigned

---

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: testkube-ca
  namespace: testkube

spec:
  ca:
    secretName: testkube-ca

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testkube-nats
  namespace: testkube

spec:
  secretName: testkube-nats
  duration: 2160h
  renewBefore: 360h
  dnsNames:
  - testkube-nats
  - testkube-nats.testkube.svc.cluster.local
  usages:
  - server auth
  issuerRef:
    name: testkube-ca

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testkube-nats-client
  namespace: testkube

spec:
  secretName: testkube-nats-client
  duration: 2160h
  renewBefore: 360h
  dnsNames:
  - testkube-api
  usages:
  - client auth
  issuerRef:
    name: testkube-ca

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testkube-s3
  namespace: testkube

spec:
  secretName: testkube-s3
  duration: 2160h
  renewBefore: 360h
  dnsNames:
  - testkube-s3
  - testkube-s3.testkube.svc.cluster.local
  usages:
  - server auth
  issuerRef:
    name: testkube-ca
  keystores:
    pkcs12:
      create: true
      profile: Modern2023
      passwordSecretRef:
        name: testkube-storage
        key: secretKey
