# ESO assumes this service account via TokenRequest; it is not used by the
# test pods and receives no Azure or cluster-wide secret-reading permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: testkube-secret-reader
  namespace: testkube

automountServiceAccountToken: false

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: testkube-secret-reader
  namespace: postgres

rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [testkube-role, platform-ca]
    verbs: [get]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testkube-secret-reader
  namespace: postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: testkube-secret-reader

subjects:
  - kind: ServiceAccount
    name: testkube-secret-reader
    namespace: testkube

---

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: testkube-postgres
  namespace: testkube

spec:
  provider:
    kubernetes:
      remoteNamespace: postgres
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:

        serviceAccount:
          name: testkube-secret-reader

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: testkube-database
  namespace: testkube

spec:
  refreshInterval: 1m
  secretStoreRef:
    name: testkube-postgres
    kind: SecretStore
  target:
    name: testkube-database
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        password: {{ "{{ .password }}" | quote }}
        dsn: 'postgres://testkube:{{ "{{ .password }}" }}@platform-rw.postgres.svc.cluster.local:5432/testkube?sslmode=verify-full&sslrootcert=/etc/testkube-postgres/ca.crt'
        ca.crt: {{ "{{ index . \"ca.crt\" }}" | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: testkube-role
        property: password
    - secretKey: ca.crt
      remoteRef:
        key: platform-ca
        property: ca.crt
