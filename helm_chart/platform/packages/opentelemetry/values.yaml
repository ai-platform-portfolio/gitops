mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
# The application exports no Langfuse key; authentication stays in the collector.
extraEnvs:
  - name: LANGFUSE_AUTHORIZATION
    valueFrom:
      secretKeyRef: { name: langfuse-otel, key: authorization }

config:
  processors:
    filter/langfuse:
      error_mode: propagate
      traces:
        span:
          - 'resource.attributes["langfuse.export"] != "true" and attributes["langfuse.export"] != "true"'

  exporters:
    otlp_http/langfuse:
      endpoint: http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel
      headers:
        Authorization: ${env:LANGFUSE_AUTHORIZATION}
        x-langfuse-ingestion-version: "4"
    otlp_grpc/tempo:
      endpoint: tempo.lgtm.svc.cluster.local:4317
      tls:
        insecure: true
    otlp_http/loki:
      endpoint: http://loki-gateway.lgtm.svc.cluster.local/otlp
    prometheusremotewrite/mimir:
      endpoint: http://mimir-gateway.lgtm.svc.cluster.local/api/v1/push
  service:
    pipelines:
      traces:
        exporters:
        - otlp_grpc/tempo
      traces/langfuse:
        receivers: [otlp]
        processors: [memory_limiter, filter/langfuse, batch]
        exporters: [otlp_http/langfuse]

      logs:
        exporters:
        - otlp_http/loki
      metrics:
        exporters:
        - prometheusremotewrite/mimir
