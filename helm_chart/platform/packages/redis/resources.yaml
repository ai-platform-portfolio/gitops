apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: redis
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis
  namespace: redis
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 0
    tls-port 6379
    tls-auth-clients yes
    tls-auth-clients-user CN
    tls-protocols "TLSv1.2 TLSv1.3"
    tls-cert-file /etc/redis-server/tls.crt
    tls-key-file /etc/redis-server/tls.key
    tls-ca-cert-file /etc/redis-server/ca.crt
    dir /data
    appendonly yes
    appendfsync everysec
    save ""
    maxmemory {{ .Values.redis.maxmemory }}
    maxmemory-policy noeviction
    # Certificate mapping authenticates enabled users even without a password.
    # resetpass prevents holders of one certificate using AUTH as another user.
    user default reset off
    user redis-probe reset on resetpass +ping
    user langfuse reset on resetpass ~langfuse:* &langfuse:* +@read +@write +@connection +@transaction +@scripting +@pubsub -@dangerous -@admin -client +info +client|setname +client|setinfo +client|id +client|unblock

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: rediss
      port: 6379
      targetPort: rediss

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
  annotations:
    secret.reloader.stakater.com/reload: redis-server,redis-probe
    configmap.reloader.stakater.com/reload: redis
spec:
  replicas: 1
  serviceName: redis
  # Keep data through StatefulSet replacement; namespace deletion owns final cleanup.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      nodeSelector:
        agentpool: platform
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: [redis-server, /etc/redis/redis.conf]
          ports:
            - name: rediss
              containerPort: 6379
          startupProbe:
            exec:
              command: [sh, -c, 'test "$(redis-cli --tls -h 127.0.0.1 --sni redis.redis.svc.cluster.local --cacert /etc/redis-probe/ca.crt --cert /etc/redis-probe/tls.crt --key /etc/redis-probe/tls.key PING)" = PONG']
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, 'test "$(redis-cli --tls -h 127.0.0.1 --sni redis.redis.svc.cluster.local --cacert /etc/redis-probe/ca.crt --cert /etc/redis-probe/tls.crt --key /etc/redis-probe/tls.key PING)" = PONG']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, 'test "$(redis-cli --tls -h 127.0.0.1 --sni redis.redis.svc.cluster.local --cacert /etc/redis-probe/ca.crt --cert /etc/redis-probe/tls.crt --key /etc/redis-probe/tls.key PING)" = PONG']
            periodSeconds: 20
            failureThreshold: 5
          resources:
{{ toYaml .Values.redis.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/redis, readOnly: true}
            - {name: server, mountPath: /etc/redis-server, readOnly: true}
            - {name: probe, mountPath: /etc/redis-probe, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: redis}
        - name: server
          secret: {secretName: redis-server, defaultMode: 0440}
        - name: probe
          secret: {secretName: redis-probe, defaultMode: 0440}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.redis.storageClass }}
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
