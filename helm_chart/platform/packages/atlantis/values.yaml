fullnameOverride: atlantis
replicaCount: 1

atlantisUrl: https://atlantis.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
orgAllowlist: {{ join "," (required "atlantis.repositories must scope allowed repositories or organisations" .Values.atlantis.repositories) | quote }}

githubApp:
  id: {{ required "atlantis.github_app_id is required" .Values.atlantis.github_app_id | quote }}
  slug: {{ required "atlantis.github_app_slug is required" .Values.atlantis.github_app_slug | quote }}
vcsSecretName: atlantis-github
basicAuthSecretName: atlantis-web

# Human-triggered plans; approved, mergeable and current-base PRs may be applied
# explicitly by the trusted team. No workflow/requirements overrides from a PR.
allowForkPRs: false
allowDraftPRs: false
disableApplyAll: true
disableRepoLocking: false
defaultTFVersion: "1.17.0"
repoConfig: |
  repos:
  - id: /.*/
    apply_requirements: [approved, mergeable, undiverged]
    allowed_overrides: []
    allow_custom_workflows: false
    repo_locks:
      mode: on_plan

environment:
  ATLANTIS_DISABLE_AUTOPLAN: "true"
  ATLANTIS_ALLOW_COMMANDS: version,plan,apply,unlock
  ATLANTIS_GH_TEAM_ALLOWLIST: {{ $team := required "atlantis.github_team is required" .Values.atlantis.github_team }}{{ printf "%s:version,%s:plan,%s:apply,%s:unlock" $team $team $team $team | quote }}
  ATLANTIS_CHECKOUT_STRATEGY: merge
  # AzureRM provider and Azure Blob backend both use the projected identity
  # token. Consumer roots must support OIDC; no Azure CLI session is required.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_USE_CLI: "false"
  ARM_TENANT_ID: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | quote }}
  ARM_SUBSCRIPTION_ID: {{ required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID | quote }}
  ARM_OIDC_TOKEN_FILE_PATH: /var/run/secrets/azure/tokens/azure-identity-token

# ASO creates this ConfigMap in the same namespace after Azure provisioning.
environmentRaw:
  - name: ARM_CLIENT_ID
    valueFrom:
      configMapKeyRef:
        name: atlantis-identity
        key: clientId

serviceAccount:
  create: true
  name: atlantis
  mount: false
enableKubernetesBackend: false

# Project a token explicitly: the runtime client ID comes from ASO, so there is
# no static service-account annotation and no identity-webhook dependency.
extraVolumes:
  - name: azure-identity-token
    projected:
      sources:
        - serviceAccountToken:
            audience: api://AzureADTokenExchange
            expirationSeconds: 3600
            path: azure-identity-token
extraVolumeMounts:
  - name: azure-identity-token
    mountPath: /var/run/secrets/azure/tokens
    readOnly: true

service:
  type: ClusterIP
  port: 80
  targetPort: 4141
ingress:
  enabled: false

# BoltDB locks, checkouts and saved plans share one Azure Disk. Terraform state
# remains in each root's persistent Azure Blob backend, outside this volume.
volumeClaim:
  enabled: true
  dataStorage: 5Gi
  storageClassName: managed-csi
  accessModes: [ReadWriteOnce]
lockingDbType: boltdb

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Finish active Terraform commands before a normal rollout stops the pod.
terminationGracePeriodSeconds: 300
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "while pgrep -x 'terraform|tofu' > /dev/null; do sleep 2; done"]
test:
  enabled: false
