fullnameOverride: atlantis
replicaCount: 1

atlantisUrl: https://atlantis.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
orgAllowlist: {{ join "," (required "atlantis.repositories must scope allowed repositories or organisations" .Values.atlantis.repositories) | quote }}

githubApp:
  id: {{ required "atlantis.github_app_id is required" .Values.atlantis.github_app_id | quote }}
  slug: {{ required "atlantis.github_app_slug is required" .Values.atlantis.github_app_slug | quote }}
vcsSecretName: atlantis-github
basicAuthSecretName: atlantis-web

# The one-account portfolio cannot self-approve GitHub PRs. Restrict commands to
# the platform team and this private repository; require a current, mergeable PR.
# Terraform plan can execute repository code, so add approval before team access.
allowForkPRs: false
allowDraftPRs: false
disableApplyAll: true
disableRepoLocking: false
defaultTFVersion: "1.17.0"
repoConfig: |
  repos:
  - id: github.com/ai-platform-portfolio/cluster-deployments
    plan_requirements: [mergeable, undiverged]
    apply_requirements: [mergeable, undiverged]
    allowed_overrides: []
    allow_custom_workflows: false
    repo_locks:
      mode: on_plan

environment:
  ATLANTIS_DISABLE_AUTOPLAN: "true"
  ATLANTIS_ALLOW_COMMANDS: version,plan,apply,unlock
  ATLANTIS_GH_TEAM_ALLOWLIST: {{ $team := required "atlantis.github_team is required" .Values.atlantis.github_team }}{{ printf "%s:version,%s:plan,%s:apply,%s:unlock" $team $team $team $team | quote }}
  ATLANTIS_CHECKOUT_STRATEGY: merge
  # AzureRM provider and Azure Blob backend both use the projected identity
  # token. Consumer roots must support OIDC; no Azure CLI session is required.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_USE_CLI: "false"
  ARM_TENANT_ID: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | quote }}
  ARM_SUBSCRIPTION_ID: {{ required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID | quote }}
  ARM_OIDC_TOKEN_FILE_PATH: /var/run/secrets/azure/tokens/azure-identity-token

# ASO creates this ConfigMap in the same namespace after Azure provisioning.
environmentRaw:
  - name: ARM_CLIENT_ID
    valueFrom:
      configMapKeyRef:
        name: atlantis-identity
        key: clientId

serviceAccount:
  create: true
  name: atlantis
  mount: false
enableKubernetesBackend: false

podTemplate:
  annotations:
    # Re-run the init gate after a role/federation configuration change.
    gitops.platform/azure-settings: {{ dict "azure" .Values.atlantis.azure "issuer" .Values.runtime.AKS_OIDC_ISSUER_URL | toJson | sha256sum | quote }}

initContainers:
  - name: await-azure
    # Official kubectl 1.35 supports the platform's 1.34-1.36 Kubernetes range.
    image: registry.k8s.io/kubectl:v1.35.0@sha256:0bb95b2a450875fc8ceaea2f9987a99fe27c228846e2e00b93b65ebb0d59034e
    command: [/bin/kubectl]
    args:
      - --cache-dir=/tmp/cache
      - wait
      - --namespace=atlantis
      - --for=condition=Ready
      - --timeout=1800s
      - resourcegroups.resources.azure.com/atlantis
      - userassignedidentities.managedidentity.azure.com/atlantis
      - federatedidentitycredentials.managedidentity.azure.com/atlantis
{{- range $name, $_ := .Values.atlantis.azure.role_assignments }}
      - roleassignments.authorization.azure.com/atlantis-{{ $name }}
{{- end }}
    volumeMounts:
      - name: readiness-api-token
        mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        readOnly: true
      - name: readiness-cache
        mountPath: /tmp
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]

# Project a token explicitly: the runtime client ID comes from ASO, so there is
# no static service-account annotation and no identity-webhook dependency.
extraVolumes:
  - name: readiness-api-token
    projected:
      sources:
        - serviceAccountToken:
            expirationSeconds: 3600
            path: token
        - configMap:
            name: kube-root-ca.crt
            items:
              - key: ca.crt
                path: ca.crt
  - name: readiness-cache
    emptyDir:
      sizeLimit: 16Mi
  - name: azure-identity-token
    projected:
      sources:
        - serviceAccountToken:
            audience: api://AzureADTokenExchange
            expirationSeconds: 3600
            path: azure-identity-token
extraVolumeMounts:
  - name: azure-identity-token
    mountPath: /var/run/secrets/azure/tokens
    readOnly: true

service:
  type: ClusterIP
  port: 80
  targetPort: 4141
ingress:
  enabled: false

# BoltDB locks, checkouts and saved plans share one Azure Disk. Terraform state
# remains in each root's persistent Azure Blob backend, outside this volume.
volumeClaim:
  enabled: true
  dataStorage: 5Gi
  storageClassName: managed-csi
  accessModes: [ReadWriteOnce]
lockingDbType: boltdb

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Finish active Terraform commands before a normal rollout stops the pod.
terminationGracePeriodSeconds: 300
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "while pgrep -x 'terraform|tofu' > /dev/null; do sleep 2; done"]
test:
  enabled: false
