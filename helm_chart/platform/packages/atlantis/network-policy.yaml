apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlantis
  namespace: atlantis
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
    ports:
    - protocol: TCP
      port: 4141
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # GitHub, Terraform registries, Entra and Azure APIs use HTTPS. This permits
  # HTTPS egress; it is not an enforced company-data perimeter or FQDN allowlist.
  - ports:
    - protocol: TCP
      port: 443
