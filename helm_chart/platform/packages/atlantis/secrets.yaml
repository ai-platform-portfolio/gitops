# ESO reads the existing platform Key Vault; no private keys enter Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-github
  namespace: atlantis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: atlantis-github
  data:
  - secretKey: key.pem
    remoteRef:
      key: atlantis-github-app-key
  - secretKey: github_secret
    remoteRef:
      key: atlantis-github-webhook-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-web
  namespace: atlantis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: atlantis-web
  data:
  - secretKey: username
    remoteRef:
      key: atlantis-web-username
  - secretKey: password
    remoteRef:
      key: atlantis-web-password
---
# ASO's bootstrap identity is already in runtime. This public identity context
# needs no duplicate Key Vault secret; ASO uses its projected token.
apiVersion: v1
kind: Secret
metadata:
  name: aso-credential
  namespace: atlantis
type: Opaque
data:
  AZURE_CLIENT_ID: {{ required "runtime.ASO_CLIENT_ID is required" .Values.runtime.ASO_CLIENT_ID | b64enc | quote }}
  AZURE_TENANT_ID: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | b64enc | quote }}
  AZURE_SUBSCRIPTION_ID: {{ required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID | b64enc | quote }}
  USE_WORKLOAD_IDENTITY_AUTH: {{ "true" | b64enc | quote }}
