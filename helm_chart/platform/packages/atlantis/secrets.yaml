# ESO reads the existing platform Key Vault; no private keys enter Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-github
  namespace: atlantis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: atlantis-github
  data:
  - secretKey: key.pem
    remoteRef:
      key: atlantis-github-app-key
  - secretKey: github_secret
    remoteRef:
      key: atlantis-github-webhook-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-web
  namespace: atlantis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: atlantis-web
  data:
  - secretKey: username
    remoteRef:
      key: atlantis-web-username
  - secretKey: password
    remoteRef:
      key: atlantis-web-password
