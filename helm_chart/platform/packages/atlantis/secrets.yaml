# ESO reads the existing platform Key Vault; no private keys enter Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-github
  namespace: atlantis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: atlantis-github
  data:
  - secretKey: key.pem
    remoteRef:
      key: atlantis-github-app-key
  - secretKey: github_secret
    remoteRef:
      key: atlantis-github-webhook-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-web
  namespace: atlantis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: atlantis-web
  data:
  - secretKey: username
    remoteRef:
      key: atlantis-web-username
  - secretKey: password
    remoteRef:
      key: atlantis-web-password
---
# Reuse ASO's existing platform authority through the same Key Vault store.
# Only public identity context is supplied; the operator uses its projected token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-aso-credential
  namespace: atlantis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: aso-credential
    template:
      data:
        AZURE_CLIENT_ID: '{{ "{{ .clientId }}" }}'
        AZURE_TENANT_ID: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | quote }}
        AZURE_SUBSCRIPTION_ID: {{ required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID | quote }}
        USE_WORKLOAD_IDENTITY_AUTH: "true"
  data:
  - secretKey: clientId
    remoteRef:
      key: {{ required "atlantis.aso_client_id_secret is required" .Values.atlantis.aso_client_id_secret | quote }}
