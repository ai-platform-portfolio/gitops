apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: public
  namespace: atlantis
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-azuredns
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    namespace: envoy-gateway-system
  listeners:
  - name: https
    hostname: atlantis.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: atlantis-tls
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlantis
  namespace: atlantis
spec:
  hostnames:
  - atlantis.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
  parentRefs:
  - name: public
    namespace: atlantis
    sectionName: https
    kind: ListenerSet
    group: gateway.networking.k8s.io
  rules:
  - backendRefs:
    - name: atlantis
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: atlantis
spec:
  hostnames:
  - atlantis.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
  parentRefs:
  - name: public
    namespace: envoy-gateway-system
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
