cluster:
  name: {{ required "runtime.CLUSTER_NAME is required" .Values.runtime.CLUSTER_NAME }}
destinations:
  mimir:
    type: prometheus
    url: http://mimir-gateway.lgtm.svc.cluster.local/api/v1/push
  loki:
    type: loki
    url: http://loki-gateway.lgtm.svc.cluster.local/loki/api/v1/push
clusterMetrics:
  enabled: true

annotationAutodiscovery:
  enabled: true
  namespaces: [argo-rollouts, testkube]
  destinations: [mimir]
  services:
    enabled: false
  bearerToken:
    enabled: false

podLogsViaKubernetesApi:
  enabled: true
collectors:
  telemetry:
    controller:
      type: deployment
      podAnnotations:
        kubernetes.azure.com/set-kube-service-host-fqdn: 'true'
telemetryServices:
  kube-state-metrics:
    deploy: true
    podAnnotations:
      kubernetes.azure.com/set-kube-service-host-fqdn: 'true'
