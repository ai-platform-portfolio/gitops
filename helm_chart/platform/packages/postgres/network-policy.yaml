apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-internal
  namespace: postgres
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
{{- if eq .Values.cluster.role "management" }}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: testkube
      podSelector:
        matchLabels:
          app.kubernetes.io/name: api-server
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: testkube
      podSelector:
        matchLabels:
          app.kubernetes.io/name: testkube-schema-check
    ports:
    - protocol: TCP
      port: 5432
{{- end }}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sonarqube
      podSelector:
        matchLabels:
          app: sonarqube
          release: sonarqube
    ports:
    - protocol: TCP
      port: 5432
{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: backstage
      podSelector:
        matchLabels:
          app.kubernetes.io/name: backstage
    ports:
    - protocol: TCP
      port: 5432
{{- end }}
{{- if and .Values.devlake.enabled (eq .Values.cluster.role "management") }}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: devlake
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lgtm
      podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
    ports:
    - {protocol: TCP, port: 5432}
{{- end }}
  - from:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: platform
    - podSelector:
        matchLabels:
          app: platform-pooler
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9187
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
  - ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      app: platform-pooler
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          gitops.platform/postgres-client: 'true'
      podSelector:
        matchLabels:
          gitops.platform/postgres-client: 'true'
    ports:
    - protocol: TCP
      port: 5432
