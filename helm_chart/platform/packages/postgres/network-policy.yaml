apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-internal
  namespace: postgres
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sonarqube
      podSelector:
        matchLabels:
          app: sonarqube
          release: sonarqube
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: platform
    - podSelector:
        matchLabels:
          app: platform-pooler
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9187
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
  - ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      app: platform-pooler
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          gitops.platform/postgres-client: 'true'
      podSelector:
        matchLabels:
          gitops.platform/postgres-client: 'true'
    ports:
    - protocol: TCP
      port: 5432
