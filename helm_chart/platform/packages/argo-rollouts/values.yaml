fullnameOverride: argo-rollouts

installCRDs: true
clusterInstall: true
# Do not silently expand the built-in Kubernetes admin/edit/view roles.
createClusterAggregateRoles: false

serviceAccount:
  name: argo-rollouts

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

controller:
  replicas: 2
  logging:
    format: json

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  readinessProbe:
    httpGet:
      path: /healthz
      port: healthz
    periodSeconds: 10
    timeoutSeconds: 5

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

  pdb:
    enabled: true
    minAvailable: 1

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

  podAnnotations:
    k8s.grafana.com/scrape: "true"
    k8s.grafana.com/metrics.portNumber: "8090"

  # Copy from an immutable, multi-architecture image before controller startup.
  # The upstream chart already provides writable plugin-bin and /tmp volumes.
  initContainers:
    - name: copy-gateway-plugin
      image: ghcr.io/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi:v0.17.0@sha256:bc40d5edf13307e455f6c18cbf9cc79715165cbee8b05a674fd88119f119d4a2
      command: [/bin/sh, -ec]
      args:
        - cp /bin/rollouts-plugin-trafficrouter-gatewayapi /plugins/gateway-api
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      volumeMounts:
        - name: gateway-plugin
          mountPath: /plugins

  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: file:///plugins/gateway-api
      args: [-logformat=json]

  volumes:
    - name: gateway-plugin
      emptyDir:
        sizeLimit: 128Mi

  volumeMounts:
    - name: gateway-plugin
      mountPath: /plugins
      readOnly: true

# Only HTTP/gRPC routing is supported here. Avoid unrelated provider permissions
# and the chart's obsolete Gateway API ConfigMap-write permissions.
providerRBAC:
  enabled: true
  providers:
    istio: false
    smi: false
    ambassador: false
    awsLoadBalancerController: false
    awsAppMesh: false
    traefik: false
    apisix: false
    contour: false
    glooPlatform: false
    gatewayAPI: false
  additionalRules:
    - apiGroups: [gateway.networking.k8s.io]
      resources: [httproutes, grpcroutes]
      verbs: [get, list, watch, update, patch]

# The standalone dashboard has no native user authentication. Use Argo CD's
# authenticated Rollout view and the CLI with Kubernetes RBAC instead.
dashboard:
  enabled: false

extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argo-rollouts-metrics
      namespace: argo-rollouts
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argo-rollouts
          app.kubernetes.io/component: rollouts-controller
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
          ports:
            - protocol: TCP
              port: 8090
