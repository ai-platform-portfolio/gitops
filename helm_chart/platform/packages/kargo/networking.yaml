apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: public
  namespace: kargo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-azuredns
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    namespace: envoy-gateway-system
  listeners:
    - name: https
      hostname: kargo.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: kargo-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo
  namespace: kargo
spec:
  hostnames:
    - kargo.{{ .Values.runtime.DNS_ZONE }}
  parentRefs:
    - name: public
      namespace: kargo
      sectionName: https
      kind: ListenerSet
      group: gateway.networking.k8s.io
  rules:
    - backendRefs:
        - name: kargo-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: kargo
spec:
  hostnames:
    - kargo.{{ .Values.runtime.DNS_ZONE }}
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
