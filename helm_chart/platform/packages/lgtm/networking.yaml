apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: public
  namespace: lgtm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-azuredns
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    namespace: envoy-gateway-system
  listeners:
  - name: https
    hostname: grafana.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: grafana-tls
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: lgtm
spec:
  hostnames:
  - grafana.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
  parentRefs:
  - name: public
    namespace: lgtm
    sectionName: https
    kind: ListenerSet
    group: gateway.networking.k8s.io
  rules:
  - backendRefs:
    - name: grafana
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: lgtm
spec:
  hostnames:
  - grafana.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
  parentRefs:
  - name: public
    namespace: envoy-gateway-system
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- if and .Values.gateway.private.enabled (eq .Values.cluster.role "management") }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: telemetry
  namespace: opentelemetry
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.gateway.private.clusterIssuer | quote }}
spec:
  parentRef: {name: private, namespace: envoy-gateway-system}
  listeners:
    - name: telemetry-https
      hostname: {{ tpl .Values.gateway.telemetry.hostname . | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{name: telemetry-private-tls}]
      allowedRoutes:
        namespaces: {from: Same}
---
# Deny even when a consumer's route is present without its own policy.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: telemetry-default
  namespace: opentelemetry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: ListenerSet, name: telemetry}
  authorization:
    defaultAction: Deny
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: private-telemetry
  namespace: lgtm
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: opentelemetry}
  to:
    - {group: "", kind: Service, name: mimir-gateway}
    - {group: "", kind: Service, name: loki-gateway}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-query-defaults
  namespace: opentelemetry
data:
  values.json: {{ merge (dict "hostname" (tpl .Values.gateway.telemetry.hostname .)) .Values.gateway.telemetry | toJson | quote }}
{{- end }}
