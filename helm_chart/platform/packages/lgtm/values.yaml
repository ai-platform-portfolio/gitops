{{- $readinessFailures := `{source="kubernetes-events",reason="Unhealthy"} |= "Readiness probe failed:"` -}}
{{- $gatewayFailures := `{namespace="envoy-gateway-system",container="envoy"} | json status="response_code", route="route_name" | __error__="" | status=~"5[0-9]{2}" | route=~"httproute/.+"` -}}
loki:
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    podLabels:
      azure.workload.identity/use: 'true'
    schemaConfig:
      configs:
      - from: '2026-01-01'
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
    storage:
      type: azure
      bucketNames:
        chunks: {{ required "runtime.STORAGE_LOKI_CHUNKS is required" .Values.runtime.STORAGE_LOKI_CHUNKS }}
        ruler: {{ required "runtime.STORAGE_LOKI_RULER is required" .Values.runtime.STORAGE_LOKI_RULER }}
      azure:
        accountName: {{ required "runtime.AZURE_STORAGE_ACCOUNT is required" .Values.runtime.AZURE_STORAGE_ACCOUNT }}
        useFederatedToken: true
  serviceAccount:
    create: false
    name: lgtm
  singleBinary:
    replicas: 1
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    serviceAccount:
      create: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

grafana:
  persistence:
    enabled: true
  deploymentStrategy:
    type: Recreate
  envFromSecrets:
  - name: grafana-azuread-app
{{- if .Values.devlake.enabled }}
  - name: devlake-grafana-database
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: devlake
          orgId: 1
          folder: Delivery
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/devlake
  dashboardsConfigMaps:
    devlake: devlake-dashboards
{{- end }}
  grafana.ini:
    server:
      root_url: https://grafana.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
    auth.azuread:
      enabled: true
      allowed_organizations: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID }}
      auth_url: https://login.microsoftonline.com/{{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID }}/oauth2/v2.0/authorize
      token_url: https://login.microsoftonline.com/{{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID }}/oauth2/v2.0/token
      allow_assign_grafana_admin: true
      role_attribute_path: contains(roles[*], 'GrafanaAdmin') && 'GrafanaAdmin' || contains(roles[*],
        'Admin') && 'Admin' || contains(roles[*], 'Editor') && 'Editor' || 'Viewer'
    auth.basic:
      enabled: false
    auth:
      disable_login_form: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Mimir
        type: prometheus
        url: http://mimir-gateway.lgtm.svc.cluster.local/prometheus
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki-gateway.lgtm.svc.cluster.local
      # Keep the existing Loki data source and its Grafana-generated UID.
      - name: Loki Readiness
        uid: loki-readiness
        type: loki
        url: http://loki-gateway.lgtm.svc.cluster.local
      - name: Tempo
        type: tempo
        url: http://tempo.lgtm.svc.cluster.local:3200
{{- if .Values.devlake.enabled }}
      - name: DevLake
        uid: devlake-postgres-api
        type: grafana-postgresql-datasource
        url: platform-rw.postgres.svc.cluster.local:5432
        user: devlake_grafana
        jsonData:
          database: devlake
          sslmode: verify-full
          tlsConfigurationMethod: file-content
          tlsAuthWithCACert: true
          postgresVersion: 1800
          maxOpenConns: 5
        secureJsonData:
          password: $DEVLAKE_POSTGRES_PASSWORD
          tlsCACert: $DEVLAKE_POSTGRES_CA
{{- end }}
  alerting:
    kubernetes-readiness.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: Kubernetes readiness
          folder: Platform
          interval: 1m
          rules:
            - uid: kubernetes-readiness-failures
              title: Repeated Kubernetes readiness failures
              condition: threshold
              data:
                - refId: readiness
                  datasourceUid: loki-readiness
                  relativeTimeRange: {from: 300, to: 0}
                  model:
                    refId: readiness
                    queryType: instant
                    editorMode: code
                    expr: >-
                      sum by (cluster, namespace) (
                        count_over_time({{ $readinessFailures }} [5m])
                      )
                - refId: threshold
                  datasourceUid: __expr__
                  relativeTimeRange: {from: 0, to: 0}
                  model:
                    refId: threshold
                    type: threshold
                    expression: readiness
                    conditions:
                      - evaluator: {type: gt, params: [1]}
              for: 1m
              noDataState: OK
              execErrState: Error
              annotations:
                summary: Repeated pod readiness failures in a Kubernetes namespace
                description: Inspect Kubernetes Events and container logs for the affected cluster and namespace.
                runbook_url: 'https://grafana.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}/explore?schemaVersion=1&panes={{ dict "events" (dict "datasource" "loki-readiness" "queries" (list (dict "refId" "A" "expr" $readinessFailures "queryType" "range")) "range" (dict "from" "now-30m" "to" "now")) | toJson | urlquery }}'
    gateway-http.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: Gateway HTTP
          folder: Platform
          interval: 1m
          rules:
            - uid: gateway-http-5xx
              title: Repeated HTTP 5xx responses
              condition: threshold
              data:
                - refId: failures
                  datasourceUid: loki-readiness
                  relativeTimeRange: {from: 300, to: 0}
                  model:
                    refId: failures
                    queryType: instant
                    editorMode: code
                    expr: >-
                      sum by (cluster, route) (
                        count_over_time({{ $gatewayFailures }} [5m])
                      )
                - refId: threshold
                  datasourceUid: __expr__
                  relativeTimeRange: {from: 0, to: 0}
                  model:
                    refId: threshold
                    type: threshold
                    expression: failures
                    conditions:
                      - evaluator: {type: gt, params: [4]}
              for: 2m
              noDataState: OK
              execErrState: Error
              annotations:
                summary: At least five HTTP 5xx responses on a route in five minutes
                description: Inspect the named HTTPRoute and its upstream service in the gateway logs.
                runbook_url: 'https://grafana.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}/explore?schemaVersion=1&panes={{ dict "errors" (dict "datasource" "loki-readiness" "queries" (list (dict "refId" "A" "expr" $gatewayFailures "queryType" "range")) "range" (dict "from" "now-30m" "to" "now")) | toJson | urlquery }}'
  serviceAccount:
    create: false
    name: lgtm

  admin:
    existingSecret: platform-grafana-admin
    userKey: user
    passwordKey: password

tempo:
  podLabels:
    azure.workload.identity/use: 'true'
  serviceAccount:
    create: false
    name: lgtm
  persistence:
    enabled: true
  tempo:
    storage:
      trace:
        backend: azure
        azure:
          container_name: {{ required "runtime.STORAGE_TEMPO_TRACES is required" .Values.runtime.STORAGE_TEMPO_TRACES }}
          storage_account_name: {{ required "runtime.AZURE_STORAGE_ACCOUNT is required" .Values.runtime.AZURE_STORAGE_ACCOUNT }}
          use_federated_token: true

mimir:
  global:
    podLabels:
      azure.workload.identity/use: 'true'
  serviceAccount:
    create: false
    name: lgtm
  minio:
    enabled: false
  kafka:
    enabled: false
  mimir:
    structuredConfig:
      multitenancy_enabled: false
      ingest_storage:
        enabled: false
      ingester:
        push_grpc_method_enabled: true
        ring:
          replication_factor: 1
      common:
        storage:
          backend: azure
          azure:
            account_name: {{ required "runtime.AZURE_STORAGE_ACCOUNT is required" .Values.runtime.AZURE_STORAGE_ACCOUNT }}
      blocks_storage:
        backend: azure
        azure:
          container_name: {{ required "runtime.STORAGE_MIMIR_BLOCKS is required" .Values.runtime.STORAGE_MIMIR_BLOCKS }}
      ruler_storage:
        azure:
          container_name: {{ required "runtime.STORAGE_MIMIR_RULER is required" .Values.runtime.STORAGE_MIMIR_RULER }}
      alertmanager_storage:
        azure:
          container_name: {{ required "runtime.STORAGE_MIMIR_ALERTMANAGER is required" .Values.runtime.STORAGE_MIMIR_ALERTMANAGER }}
  ingester:
    replicas: 1
    zoneAwareReplication:
      enabled: false
  store_gateway:
    zoneAwareReplication:
      enabled: false
  querier:
    replicas: 1
  query_scheduler:
    replicas: 1
