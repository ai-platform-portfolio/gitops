langfuse:
  extraVolumes:
    - name: postgres-client
      secret:
        secretName: langfuse-postgres
  extraVolumeMounts:
    - name: postgres-client
      mountPath: /etc/langfuse-postgres
      readOnly: true
  additionalEnv:
    # Direct CNPG primary for both runtime and Prisma startup migrations.
    # The PKCS#12 wrapping value is public; authentication uses the certificate.
    - name: DATABASE_URL
      value: postgresql://langfuse@platform-rw.postgres.svc.cluster.local:5432/langfuse?sslmode=require&sslaccept=strict&sslcert=/etc/langfuse-postgres/ca.crt&sslidentity=/etc/langfuse-postgres/keystore.p12&sslpassword=changeit
  worker:
    deployment:
      annotations:
        secret.reloader.stakater.com/reload: langfuse-postgres

  web:
    deployment:
      annotations:
        secret.reloader.stakater.com/reload: langfuse-postgres{{ if .Values.langfuse.sso.enabled }},langfuse-sso{{ end }}
{{- if .Values.langfuse.sso.enabled }}
  auth:
    disableUsernamePassword: {{ .Values.langfuse.sso.disableUsernamePassword }}
    providers:
      azureAd:
        clientId:
          secretKeyRef: { name: langfuse-sso, key: client-id }
        clientSecret:
          secretKeyRef: { name: langfuse-sso, key: client-secret }
        tenantId:
          secretKeyRef: { name: langfuse-sso, key: tenant-id }
        allowAccountLinking: {{ .Values.langfuse.sso.allowAccountLinking | quote }}
{{- end }}
  salt:
    secretKeyRef: { name: platform-langfuse-app, key: salt }
  encryptionKey:
    secretKeyRef: { name: platform-langfuse-app, key: encryption-key }
  nextauth:
    secret:
      secretKeyRef: { name: platform-langfuse-app, key: nextauth-secret }
    url: https://langfuse.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
clickhouse:
  auth:
    existingSecret: platform-langfuse-clickhouse
    existingSecretKey: password
  keeper:
    replicas: 1

# Shared CNPG owns the database/role; no bundled StatefulSet or DB password.
postgresql:
  deploy: false
  host: platform-rw.postgres.svc.cluster.local
  auth:
    username: langfuse
    database: langfuse

redis:
  auth:
    existingSecret: platform-langfuse-redis
    existingSecretPasswordKey: default
    usersExistingSecret: platform-langfuse-redis

s3:
  auth:
    existingSecret: platform-langfuse-s3
    rootUserSecretKey: accessKey
    rootPasswordSecretKey: secretKey
  allInOne:
    s3:
      existingConfigSecret: platform-langfuse-s3
