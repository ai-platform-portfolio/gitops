langfuse:
  image:
    tag: "4.76.0"

{{- if .Values.langfuse.redis.useShared }}
  podSecurityContext:
    fsGroup: 1000
{{- end }}

  extraVolumes:
{{- if .Values.langfuse.redis.useShared }}
    - name: redis-client
      secret:
        secretName: langfuse-redis
        defaultMode: 0440
{{- end }}
    - name: postgres-client
      secret:
        secretName: langfuse-postgres
  extraVolumeMounts:
{{- if .Values.langfuse.redis.useShared }}
    - name: redis-client
      mountPath: /etc/langfuse-redis
      readOnly: true
{{- end }}
    - name: postgres-client
      mountPath: /etc/langfuse-postgres
      readOnly: true
  additionalEnv:
{{- if .Values.langfuse.redis.useShared }}
    - name: REDIS_KEY_PREFIX
      value: "langfuse:"
{{- end }}
    # Direct CNPG primary for both runtime and Prisma startup migrations.
    # The PKCS#12 wrapping value is public; authentication uses the certificate.
    - name: DATABASE_URL
      value: postgresql://langfuse@platform-rw.postgres.svc.cluster.local:5432/langfuse?sslmode=require&sslaccept=strict&sslcert=/etc/langfuse-postgres/ca.crt&sslidentity=/etc/langfuse-postgres/keystore.p12&sslpassword=changeit
    - name: LANGFUSE_INIT_ORG_ID
      value: {{ required "langfuse.bootstrap.organization is required" .Values.langfuse.bootstrap.organization | quote }}
    - name: LANGFUSE_INIT_ORG_NAME
      value: {{ required "langfuse.bootstrap.organization is required" .Values.langfuse.bootstrap.organization | quote }}
    - name: LANGFUSE_INIT_PROJECT_ID
      value: {{ required "langfuse.bootstrap.project is required" .Values.langfuse.bootstrap.project | quote }}
    - name: LANGFUSE_INIT_PROJECT_NAME
      value: {{ required "langfuse.bootstrap.project is required" .Values.langfuse.bootstrap.project | quote }}
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom:
        secretKeyRef: { name: langfuse-otel, key: public-key }
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom:
        secretKeyRef: { name: langfuse-otel, key: secret-key }

  worker:
    deployment:
      annotations:
        secret.reloader.stakater.com/reload: langfuse-postgres{{ if .Values.langfuse.redis.useShared }},langfuse-redis{{ end }}

  web:
    deployment:
      annotations:
        secret.reloader.stakater.com/reload: langfuse-postgres{{ if .Values.langfuse.redis.useShared }},langfuse-redis{{ end }}{{ if .Values.langfuse.sso.enabled }},langfuse-sso{{ end }}
{{- if .Values.langfuse.sso.enabled }}
  auth:
    disableUsernamePassword: {{ .Values.langfuse.sso.disableUsernamePassword }}
    providers:
      azureAd:
        clientId:
          secretKeyRef: { name: langfuse-sso, key: client-id }
        clientSecret:
          secretKeyRef: { name: langfuse-sso, key: client-secret }
        tenantId:
          secretKeyRef: { name: langfuse-sso, key: tenant-id }
        allowAccountLinking: {{ .Values.langfuse.sso.allowAccountLinking | quote }}
{{- end }}
  salt:
    secretKeyRef: { name: platform-langfuse-app, key: salt }
  encryptionKey:
    secretKeyRef: { name: platform-langfuse-app, key: encryption-key }
  nextauth:
    secret:
      secretKeyRef: { name: platform-langfuse-app, key: nextauth-secret }
    url: https://langfuse.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
clickhouse:
  # Preserve backing-store versions across the application/chart upgrade.
  cluster:
    image:
      tag: "26.4"

  auth:
    existingSecret: platform-langfuse-clickhouse
    existingSecretKey: password
  keeper:
    image:
      tag: "26.4"
    replicas: 1

# Shared CNPG owns the database/role; no bundled StatefulSet or DB password.
postgresql:
  deploy: false
  host: platform-rw.postgres.svc.cluster.local
  auth:
    username: langfuse
    database: langfuse

redis:
{{- if .Values.langfuse.redis.useShared }}
  deploy: false
  host: redis.redis.svc.cluster.local
  tls:
    enabled: true
    caPath: /etc/langfuse-redis/ca.crt
    certPath: /etc/langfuse-redis/tls.crt
    keyPath: /etc/langfuse-redis/tls.key
  auth:
    username: null
    password: null
    existingSecret: ""
    usersExistingSecret: ""
{{- else }}
  auth:
    existingSecret: platform-langfuse-redis
    existingSecretPasswordKey: default
    usersExistingSecret: platform-langfuse-redis
{{- end }}

s3:
  auth:
    existingSecret: platform-langfuse-s3
    rootUserSecretKey: accessKey
    rootPasswordSecretKey: secretKey
  allInOne:
    s3:
      existingConfigSecret: platform-langfuse-s3
