{{- if .Values.langfuse.sso.enabled }}
{{- if or (not (kindIs "slice" .Values.langfuse.sso.users)) (empty .Values.langfuse.sso.users) }}
{{- fail "Configure at least one langfuse.sso.users entry" }}
{{- end }}
{{- if or (lt (int .Values.langfuse.sso.credentialValidityDays) 30) (gt (int .Values.langfuse.sso.credentialValidityDays) 365) }}
{{- fail "langfuse.sso.credentialValidityDays must be between 30 and 365" }}
{{- end }}
{{- end }}
{{- $settings := dict
  "enabled" .Values.langfuse.sso.enabled
  "applicationName" (printf "portfolio-%s-langfuse" .Values.cluster.name)
  "redirectUri" (printf "https://langfuse.%s/api/auth/callback/azure-ad" .Values.runtime.DNS_ZONE)
  "users" .Values.langfuse.sso.users
  "credentialValidityDays" (int .Values.langfuse.sso.credentialValidityDays)
  "vaultSecretName" (printf "%s-langfuse-oidc" .Values.cluster.name)
-}}
# Non-secret settings are owned by GitOps; the lifecycle reads this ConfigMap
# to reconcile the Microsoft Graph resources that ASO cannot provision.
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-sso-settings
  namespace: langfuse
data:
  settings: |
{{ $settings | toPrettyJson | indent 4 }}
{{- if .Values.langfuse.sso.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-sso
  namespace: langfuse
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: langfuse-sso
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ printf "%s-langfuse-oidc" .Values.cluster.name }}
        property: AUTH_AZURE_AD_CLIENT_ID

    - secretKey: client-secret
      remoteRef:
        key: {{ printf "%s-langfuse-oidc" .Values.cluster.name }}
        property: AUTH_AZURE_AD_CLIENT_SECRET

    - secretKey: tenant-id
      remoteRef:
        key: {{ printf "%s-langfuse-oidc" .Values.cluster.name }}
        property: AUTH_AZURE_AD_TENANT_ID
{{- end }}
