# Read only Langfuse's client identity and the shared server CA. The CA private
# key stays in postgres; Langfuse has no database password or admin credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse-postgres-reader
  namespace: langfuse
automountServiceAccountToken: false

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: langfuse-postgres-reader
  namespace: postgres
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [langfuse-postgres-client, platform-ca]
    verbs: [get]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: langfuse-postgres-reader
  namespace: postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: langfuse-postgres-reader
subjects:
  - kind: ServiceAccount
    name: langfuse-postgres-reader
    namespace: langfuse

---

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: langfuse-postgres
  namespace: langfuse
spec:
  provider:
    kubernetes:
      remoteNamespace: postgres
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: langfuse-postgres-reader

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-postgres
  namespace: langfuse
spec:
  refreshInterval: 1m
  secretStoreRef: {name: langfuse-postgres, kind: SecretStore}
  target:
    name: langfuse-postgres
  data:
    - secretKey: keystore.p12
      remoteRef:
        key: langfuse-postgres-client
        property: keystore.p12
    - secretKey: ca.crt
      remoteRef:
        key: platform-ca
        property: ca.crt
