# ESO creates ASO's namespace credential after the platform Key Vault store is
# Ready. Do not reflect this provisioner credential into application namespaces.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aso-credential
  namespace: azure-resources
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: aso-credential
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        AZURE_CLIENT_ID: '{{ "{{ .clientId }}" }}'
        AZURE_TENANT_ID: '{{ "{{ .tenantId }}" }}'
        AZURE_SUBSCRIPTION_ID: '{{ "{{ .subscriptionId }}" }}'
        USE_WORKLOAD_IDENTITY_AUTH: "true"
  data:
    - secretKey: clientId
      remoteRef: {key: aso-client-id}
    - secretKey: tenantId
      remoteRef: {key: tenant-id}
    - secretKey: subscriptionId
      remoteRef: {key: subscription-id}
