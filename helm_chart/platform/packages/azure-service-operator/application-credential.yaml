# Platform-owned Azure resource namespace. Application pods do not receive
# this credential; ASO uses it only for CRs authored by trusted GitOps.
apiVersion: v1
kind: Secret
metadata:
  name: aso-credential
  namespace: azure-resources
type: Opaque
data:
  AZURE_CLIENT_ID: {{ required "runtime.ASO_CLIENT_ID is required" .Values.runtime.ASO_CLIENT_ID | b64enc | quote }}
  AZURE_TENANT_ID: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | b64enc | quote }}
  AZURE_SUBSCRIPTION_ID: {{ required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID | b64enc | quote }}
  USE_WORKLOAD_IDENTITY_AUTH: {{ "true" | b64enc | quote }}
