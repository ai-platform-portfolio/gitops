{{- $targetNamespaces := list "azure-resources" "argocd" }}
{{- if eq .Values.cluster.role "management" }}
{{- $targetNamespaces = append $targetNamespaces "cluster-onboarding" }}
{{- end }}
{{- $targetNamespaces = append $targetNamespaces "testkube" }}
{{- if .Values.holmes.enabled }}
{{- $targetNamespaces = append $targetNamespaces "holmes" }}
{{- end }}
{{- if .Values.atlantis.enabled }}
{{- $targetNamespaces = append $targetNamespaces "atlantis" }}
{{- end }}

# One controller fits the initial non-HA portfolio; retain upstream resource limits.
replicaCount: 1

podDisruptionBudget:
  enabled: false

serviceAccount:
  name: azureserviceoperator-default

# ASO owns CRD installation/upgrades. Make service dependency APIs available
# for future GitOps consumers without creating any Azure resource instances.
installCRDs: true
crdPattern:
  - resources.azure.com/*
  - managedidentity.azure.com/*
  - authorization.azure.com/*
  - storage.azure.com/*

azureTargetNamespaces:
{{- range $targetNamespaces }}
  - {{ . }}
{{- end }}

# The controller reads this list from an environment variable at startup.
# Roll it when GitOps changes the watched namespace set.
podAnnotations:
  gitops.platform/watch-namespaces: {{ $targetNamespaces | toJson | sha256sum | quote }}

# The settings Secret is required even without a global Azure credential.
# Namespace-scoped aso-credential Secrets supply private account/identity values.
createAzureOperatorSecret: true
azureTenantID: ""
azureSubscriptionID: ""
azureClientID: ""
useWorkloadIdentityAuth: true

# The upstream policy also permits SQL database traffic which this CRD set needs
# no access to. Use the package-owned DNS/API-only policy instead.
networkPolicies:
  enable: false
