# Generate once in-cluster and reflect only to the notification sender.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: onboarding-webhook
  namespace: cluster-onboarding
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onboarding-webhook
  namespace: cluster-onboarding
spec:
  refreshPolicy: CreatedOnce
  target:
    name: onboarding-webhook
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: atlantis
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: atlantis
      data:
        token: {{ "{{ .password }}" | quote }}
        headers: {{ `{{ dict "Authorization" (printf "Bearer %s" .password) | toJson }}` | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: onboarding-webhook
