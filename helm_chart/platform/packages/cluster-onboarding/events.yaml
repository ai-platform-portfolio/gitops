apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: onboarding
  namespace: cluster-onboarding
spec:
  jetstream:
    version: 2.10.29
    replicas: 1
    nodeSelector:
      agentpool: platform
    persistence:
      storageClassName: managed-csi
      accessMode: ReadWriteOnce
      volumeSize: 1Gi
    containerTemplate:
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: atlantis
  namespace: cluster-onboarding
spec:
  eventBusName: onboarding
  template:
    serviceAccountName: onboarding-event-source
    nodeSelector:
      agentpool: platform
    container:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    apply:
      port: "12000"
      endpoint: /apply
      method: POST
      authSecret:
        name: onboarding-webhook
        key: token
