{{- $cluster := .Values.cluster.name -}}
{{- range $service := list "langfuse" "devlake" }}
{{- if or (ne $service "devlake") $.Values.devlake.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $service }}-sso
  namespace: {{ $service }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: {{ $service }}-sso
    template:
      data:
        client-id: '{{ "{{ .clientId }}" }}'
        client-secret: '{{ "{{ .clientSecret }}" }}'
        tenant-id: {{ required "runtime.AZURE_TENANT_ID is required" $.Values.runtime.AZURE_TENANT_ID | quote }}
  data:
    - secretKey: clientId
      remoteRef:
        key: {{ $cluster }}-{{ $service }}-sso-client-id
    - secretKey: clientSecret
      remoteRef:
        key: {{ $cluster }}-{{ $service }}-sso-client-secret
{{- end }}
{{- end }}
