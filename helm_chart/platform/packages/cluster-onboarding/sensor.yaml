dependencies:
  - name: applied
    eventSourceName: onboarding
    eventName: apply
    filters:
      data:
        - path: body.metadata.name
          type: string
          value: [{{ printf "^onboard-%s$" (regexQuoteMeta .clusterName) | quote }}]
        - path: body.data.revision
          type: string
          value: ["^[a-f0-9]{40,64}$"]
        - path: body.data.request
          type: string
          value: ["^[a-f0-9]{32}$"]
triggers:
  - retryStrategy:
      steps: 5
      duration: 1s
      factor: 2
    template:
      name: onboard
      k8s:
        # Native update creates an absent Job and preserves an existing one.
        # One stable name per cluster coalesces signals while onboarding runs.
        operation: update
        source:
          resource:
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: onboard-{{ .clusterName }}
              namespace: cluster-onboarding
              labels:
                platform.ai-platform-portfolio/cluster: {{ .clusterName }}
            spec:
              activeDeadlineSeconds: 28800
              backoffLimit: 2
              # Release the name when finished; logs remain in shared logging.
              ttlSecondsAfterFinished: 0
              template:
                metadata:
                  labels:
                    azure.workload.identity/use: "true"
                spec:
                  serviceAccountName: cluster-onboarding
                  restartPolicy: Never
                  nodeSelector:
                    agentpool: platform
                  containers:
                    - name: worker
                      image: {{ required "clusterOnboarding.image is required" .Values.clusterOnboarding.image | quote }}
                      imagePullPolicy: IfNotPresent
                      env:
                        - name: CLUSTER_NAME
                          value: {{ .clusterName | quote }}
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        runAsNonRoot: true
                        capabilities:
                          drop: [ALL]
                      volumeMounts:
                        - name: tmp
                          mountPath: /tmp
                      resources:
                        requests: {cpu: 50m, memory: 256Mi}
                        limits: {memory: 768Mi}
                  volumes:
                    - name: tmp
                      emptyDir: {}
