{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: public
  namespace: backstage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-azuredns
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    namespace: envoy-gateway-system
  listeners:
  - name: https
    hostname: backstage.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: backstage-tls
    allowedRoutes:
      namespaces:
        from: Same
{{- end }}
---
{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: backstage
spec:
  hostnames:
  - backstage.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
  parentRefs:
  - name: public
    namespace: backstage
    sectionName: https
    kind: ListenerSet
    group: gateway.networking.k8s.io
  rules:
  - backendRefs:
    - name: backstage
      port: 7007
{{- end }}
---
{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: backstage
spec:
  hostnames:
  - backstage.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
  parentRefs:
  - name: public
    namespace: envoy-gateway-system
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}
