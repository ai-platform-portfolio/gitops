{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
# Portfolio identity metadata is GitOps-owned. GitHub App credentials are read
# from the existing platform vault by ESO, without entering a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-identity
  namespace: backstage
data:
  catalog-org.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: platform-team
    spec:
      type: team
      children: []
{{- range $name, $user := .Values.backstage.users }}
    ---
    apiVersion: backstage.io/v1alpha1
    kind: User
    metadata:
      name: {{ $name }}
      annotations:
        graph.microsoft.com/user-id: {{ $user.objectId | quote }}
    spec:
      profile:
        displayName: {{ $user.displayName | quote }}
      memberOf: {{ $user.memberOf | toJson }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-integrations
  namespace: backstage
data:
  app-config.integrations.yaml: |
    platform:
      gitopsRepoUrl: github.com?owner=ai-platform-portfolio&repo=gitops
{{- if .Values.backstage.clusterRequests.enabled }}
      clusterRepoUrl: github.com?owner=ai-platform-portfolio&repo=cluster-deployments

    integrations:
      github:
        - host: github.com
          apps:
            - appId: ${BACKSTAGE_GITHUB_APP_ID}
              allowedInstallationOwners: [ai-platform-portfolio]
              clientId: ${BACKSTAGE_GITHUB_CLIENT_ID}
              clientSecret: ${BACKSTAGE_GITHUB_CLIENT_SECRET}
              webhookSecret: ${BACKSTAGE_GITHUB_WEBHOOK_SECRET}
              privateKey: ${BACKSTAGE_GITHUB_APP_PRIVATE_KEY}
{{- end }}
---
# Password generators are stateless. Immutable orphan targets preserve the
# original value even if an ExternalSecret is recreated during reconciliation.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: backstage-database-password
  namespace: postgres
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-role
  namespace: postgres
spec:
  refreshPolicy: CreatedOnce
  target:
    name: backstage-role
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: backstage
        password: {{ "{{ .password }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: backstage-database-password
{{- if .Values.backstage.clusterRequests.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: backstage-github
  data:
    - secretKey: app-id
      remoteRef:
        key: backstage-github-app-id
    - secretKey: private-key
      remoteRef:
        key: cluster-github-app-key
    - secretKey: client-id
      remoteRef:
        key: backstage-github-client-id
    - secretKey: client-secret
      remoteRef:
        key: backstage-github-client-secret
    - secretKey: webhook-secret
      remoteRef:
        key: cluster-github-webhook-secret
{{- end }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: backstage-session
  namespace: backstage
spec:
  length: 64
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-session
  namespace: backstage
spec:
  refreshPolicy: CreatedOnce
  target:
    name: backstage-session
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        secret: {{ "{{ .password }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: backstage-session
{{- end }}
