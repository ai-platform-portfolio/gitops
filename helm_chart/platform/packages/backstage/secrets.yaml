{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
# Existing ESO and its Azure identity read these operator-provided Key Vault
# entries. The portal itself receives no Azure credentials or cluster API token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-auth
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: backstage-auth
  data:
    - secretKey: AUTH_OIDC_METADATA_URL
      remoteRef:
        key: backstage-oidc-metadata-url
    - secretKey: AUTH_OIDC_CLIENT_ID
      remoteRef:
        key: backstage-oidc-client-id
    - secretKey: AUTH_OIDC_CLIENT_SECRET
      remoteRef:
        key: backstage-oidc-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-identity
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: backstage-identity
  data:
    - secretKey: catalog-org.yaml
      remoteRef:
        key: backstage-catalog-org
---
# Optional integration config is supplied even when empty ({}). It can contain
# a GitHub Enterprise App and platform.gitopsRepoUrl for the approved repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-integrations
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: backstage-integrations
  data:
    - secretKey: app-config.integrations.yaml
      remoteRef:
        key: backstage-integrations
---
# Password generators are stateless. Immutable orphan targets preserve the
# original value even if an ExternalSecret is recreated during reconciliation.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: backstage-database-password
  namespace: postgres
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-role
  namespace: postgres
spec:
  refreshPolicy: CreatedOnce
  target:
    name: backstage-role
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: backstage
        password: {{ "{{ .password }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: backstage-database-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: backstage-session
  namespace: backstage
spec:
  length: 64
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-session
  namespace: backstage
spec:
  refreshPolicy: CreatedOnce
  target:
    name: backstage-session
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        secret: {{ "{{ .password }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: backstage-session
{{- end }}
