{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
# Portfolio identity metadata and empty integration settings are GitOps-owned.
# Credentials come from Crossplane; no separate Key Vault setup is required.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-identity
  namespace: backstage
data:
  catalog-org.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: platform-team
    spec:
      type: team
      children: []
{{- range $name, $user := .Values.backstage.users }}
    ---
    apiVersion: backstage.io/v1alpha1
    kind: User
    metadata:
      name: {{ $name }}
      annotations:
        graph.microsoft.com/user-id: {{ $user.objectId | quote }}
    spec:
      profile:
        displayName: {{ $user.displayName | quote }}
      memberOf: {{ $user.memberOf | toJson }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-integrations
  namespace: backstage
data:
  app-config.integrations.yaml: '{}'
---
# Password generators are stateless. Immutable orphan targets preserve the
# original value even if an ExternalSecret is recreated during reconciliation.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: backstage-database-password
  namespace: postgres
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-role
  namespace: postgres
spec:
  refreshPolicy: CreatedOnce
  target:
    name: backstage-role
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: backstage
        password: {{ "{{ .password }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: backstage-database-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: backstage-session
  namespace: backstage
spec:
  length: 64
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-session
  namespace: backstage
spec:
  refreshPolicy: CreatedOnce
  target:
    name: backstage-session
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        secret: {{ "{{ .password }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: backstage-session
{{- end }}
