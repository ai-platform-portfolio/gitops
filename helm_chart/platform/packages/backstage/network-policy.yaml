{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
{{- $entraPrefixes := .Files.Get "packages/backstage/entra-prefixes.yaml" | fromYamlArray }}
{{- if or (empty $entraPrefixes) (has "0.0.0.0/0" $entraPrefixes) }}
{{- fail "Backstage Entra egress requires a nonempty, scoped IPv4 prefix list" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backstage
  namespace: backstage
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - {protocol: TCP, port: 7007}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
          podSelector:
            matchLabels:
              cnpg.io/cluster: platform
      ports:
        - {protocol: TCP, port: 5432}
    # Kubernetes NetworkPolicy cannot match FQDNs. Limit auth egress to Microsoft's
    # published Entra ranges; this is an IP boundary, not hostname enforcement.
    - to:
{{- range $entraPrefixes }}
        - ipBlock:
            cidr: {{ . }}
{{- end }}
      ports:
        - {protocol: TCP, port: 443}
{{- with .Values.backstage.egress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
