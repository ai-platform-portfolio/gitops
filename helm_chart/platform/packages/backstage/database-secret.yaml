# ESO assumes this service account via TokenRequest; it is not used by the
# portal pods and receives no Azure or cluster-wide secret-reading permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-secret-reader
  namespace: backstage
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-secret-reader
  namespace: postgres
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [backstage-role, platform-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-secret-reader
  namespace: postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-secret-reader
subjects:
  - kind: ServiceAccount
    name: backstage-secret-reader
    namespace: backstage
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: backstage-postgres
  namespace: backstage
spec:
  provider:
    kubernetes:
      remoteNamespace: postgres
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: backstage-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-database
  namespace: backstage
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: backstage-postgres
    kind: SecretStore
  target:
    name: backstage-database
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: backstage-role
        property: password
    - secretKey: ca.crt
      remoteRef:
        key: platform-ca
        property: ca.crt
