{{- if .Values.litellm.access.enabled }}
# Only inference paths are exposed from the existing private gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: litellm
  namespace: litellm
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.gateway.private.clusterIssuer | quote }}
spec:
  parentRef: {name: private, namespace: envoy-gateway-system}
  listeners:
    - name: models-https
      hostname: {{ tpl .Values.litellm.access.hostname . | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{name: litellm-private-tls}]
      allowedRoutes:
        namespaces: {from: Same}

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-inference
  namespace: litellm
spec:
  parentRefs: [{name: litellm, kind: ListenerSet, group: gateway.networking.k8s.io}]
  hostnames: [{{ tpl .Values.litellm.access.hostname . | quote }}]
  rules:
    - matches:
        - path: {type: Exact, value: /v1/chat/completions}
          method: POST
      backendRefs: [{name: litellm, port: 4000}]

{{- end }}
