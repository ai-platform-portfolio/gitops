{{- $google := and .Values.litellm.google.enabled (not (empty .Values.runtime.GOOGLE_GATEWAY_PROVIDER)) (not (empty .Values.runtime.GOOGLE_GATEWAY_PROJECT)) (not (empty .Values.runtime.GOOGLE_GATEWAY_ACCOUNT)) (not (empty .Values.runtime.GOOGLE_GATEWAY_AUDIENCE)) -}}
{{- $bedrock := and .Values.litellm.bedrock.enabled (not (empty .Values.runtime.AWS_GATEWAY_ROLE_ARN)) -}}
# The upstream chart appVersion is pinned independently of its mutable defaults.
fullnameOverride: litellm
replicaCount: 1
numWorkers: 1

image:
  repository: {{ .Values.litellm.image.repository }}
  tag: {{ .Values.litellm.image.tag }}
  pullPolicy: IfNotPresent

serviceAccount:
  # Created by the earlier credentials Application for the PreSync migration.
  create: false
  name: litellm
  automount: false

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: false

db:
  deployStandalone: false
  # Supply a certificate-only URL directly; useExisting injects a password ref.
  useExisting: false

redis:
  enabled: false

masterkeySecretName: litellm-keys
masterkeySecretKey: master-key
environmentSecrets: [litellm-keys]
{{- if .Values.litellm.azure.enabled }}
environmentConfigMaps: [litellm-provider]
{{- end }}

extraEnvVars:
{{- if $bedrock }}
  - name: AWS_ROLE_ARN
    value: {{ .Values.runtime.AWS_GATEWAY_ROLE_ARN | quote }}
  - name: AWS_WEB_IDENTITY_TOKEN_FILE
    value: /identity/aws/aws-token
  - name: AWS_REGION
    value: {{ .Values.litellm.bedrock.region | quote }}
  - name: AWS_STS_REGIONAL_ENDPOINTS
    value: regional
{{- end }}
  - name: AZURE_TENANT_ID
    value: {{ .Values.runtime.AZURE_TENANT_ID | quote }}
  - name: AZURE_FEDERATED_TOKEN_FILE
    value: /identity/azure-token

terminationGracePeriodSeconds: 120

envVars:
  DATABASE_URL: postgresql://litellm@platform-rw.postgres.svc.cluster.local:5432/litellm?sslmode=require&sslaccept=strict&sslcert=/etc/litellm-postgres/ca.crt&sslidentity=/etc/litellm-postgres/keystore.p12&sslpassword=changeit&connection_limit=5
  # Native migration coordination uses libpq; Prisma keeps the PKCS#12 URL.
  PGSSLCERT: /etc/litellm-postgres/tls.crt
  PGSSLKEY: /etc/litellm-postgres/tls.key
  # Bind clients to Git-managed configuration; provider onboarding is separate.
  STORE_MODEL_IN_DB: "False"
  GRACEFUL_SHUTDOWN_TIMEOUT: "90"

proxy_config:
  model_list:
{{- if .Values.litellm.modelList }}
{{ toYaml .Values.litellm.modelList | indent 4 }}
{{- else if and (not .Values.litellm.azure.enabled) (not $google) (not $bedrock) }}
    []
{{- end }}
{{- if .Values.litellm.azure.enabled }}
    - model_name: chat
      litellm_params:
        model: {{ printf "azure/%s" .Values.litellm.azure.chat.deployment | quote }}
        api_base: {{ printf "https://%s.cognitiveservices.azure.com/" (include "platform.foundryName" .) | quote }}
        api_version: {{ .Values.litellm.azure.apiVersion | quote }}
      model_info:
        base_model: {{ .Values.litellm.azure.chat.baseModel | quote }}
    - model_name: reasoning
      litellm_params:
        model: {{ printf "azure/%s" .Values.litellm.azure.chat.deployment | quote }}
        api_base: {{ printf "https://%s.cognitiveservices.azure.com/" (include "platform.foundryName" .) | quote }}
        api_version: {{ .Values.litellm.azure.apiVersion | quote }}
      model_info:
        base_model: {{ .Values.litellm.azure.chat.baseModel | quote }}
    - model_name: coding
      litellm_params:
        model: {{ printf "azure/%s" .Values.litellm.azure.chat.deployment | quote }}
        api_base: {{ printf "https://%s.cognitiveservices.azure.com/" (include "platform.foundryName" .) | quote }}
        api_version: {{ .Values.litellm.azure.apiVersion | quote }}
      model_info:
        base_model: {{ .Values.litellm.azure.chat.baseModel | quote }}
    - model_name: embedding
      litellm_params:
        model: {{ printf "azure/%s" .Values.litellm.azure.embedding.deployment | quote }}
        api_base: {{ printf "https://%s.cognitiveservices.azure.com/" (include "platform.foundryName" .) | quote }}
        api_version: {{ .Values.litellm.azure.apiVersion | quote }}
      model_info:
        base_model: {{ .Values.litellm.azure.embedding.baseModel | quote }}
{{- end }}
{{- if $google }}
    - model_name: gemini
      litellm_params:
        model: {{ printf "vertex_ai/%s" .Values.litellm.google.gemini | quote }}
        vertex_project: {{ .Values.runtime.GOOGLE_GATEWAY_PROJECT | quote }}
        vertex_location: {{ .Values.litellm.google.location | quote }}
        vertex_credentials: /etc/litellm-google/credentials.json
      model_info:
        base_model: {{ printf "vertex_ai/%s" .Values.litellm.google.gemini | quote }}
{{- end }}
{{- if $bedrock }}
    - model_name: claude
      litellm_params:
        model: {{ printf "bedrock/converse/%s" .Values.litellm.bedrock.claude | quote }}
        aws_region_name: {{ .Values.litellm.bedrock.region | quote }}
      model_info:
        base_model: {{ .Values.litellm.bedrock.claude | quote }}
{{- end }}
  litellm_settings:
    enable_azure_ad_token_refresh: true
    set_verbose: false
  router_settings:
    num_retries: 0
    fallbacks: []
    context_window_fallbacks: []
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    allow_client_side_credentials: false
    fail_closed_budget_enforcement: true
    fail_closed_rate_limit_enforcement: true
    disable_budget_reservation: false
    store_prompts_in_spend_logs: false
    coordination_redis:
      host: redis.redis.svc.cluster.local
      port: 6379
      namespace: litellm
      ssl: true
      ssl_check_hostname: true
      ssl_cert_reqs: required
      ssl_ca_certs: /etc/litellm-redis/ca.crt
      ssl_certfile: /etc/litellm-redis/tls.crt
      ssl_keyfile: /etc/litellm-redis/tls.key

podSecurityContext:
  fsGroup: 1000
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}

nodeSelector:
  agentpool: platform

resources:
  requests: {cpu: "1", memory: 4Gi}
  limits: {memory: 4Gi}

deploymentAnnotations:
  secret.reloader.stakater.com/reload: litellm-postgres,litellm-redis

volumes:
  - name: postgres-client
    secret: {secretName: litellm-postgres, defaultMode: 0440}
  - name: redis-client
    secret: {secretName: litellm-redis, defaultMode: 0440}
  - name: azure-identity
    projected:
      sources:
        - serviceAccountToken: {audience: api://AzureADTokenExchange, expirationSeconds: 3600, path: azure-token}

{{- if $google }}
  - name: google-identity
    projected:
      sources:
        - serviceAccountToken:
            audience: {{ .Values.runtime.GOOGLE_GATEWAY_AUDIENCE | quote }}
            expirationSeconds: 3600
            path: google-token
  - name: google-credentials
    configMap: {name: litellm-google}
{{- end }}

{{- if $bedrock }}
  - name: aws-identity
    projected:
      sources:
        - serviceAccountToken: {audience: sts.amazonaws.com, expirationSeconds: 3600, path: aws-token}
{{- end }}

volumeMounts:
  - {name: postgres-client, mountPath: /etc/litellm-postgres, readOnly: true}
  - {name: redis-client, mountPath: /etc/litellm-redis, readOnly: true}
  - {name: azure-identity, mountPath: /identity, readOnly: true}

{{- if $google }}
  - {name: google-identity, mountPath: /identity/google, readOnly: true}
  - {name: google-credentials, mountPath: /etc/litellm-google, readOnly: true}
{{- end }}

{{- if $bedrock }}
  - {name: aws-identity, mountPath: /identity/aws, readOnly: true}
{{- end }}

migrationJob:
  enabled: true
  activeDeadlineSeconds: 600
  backoffLimit: 2
  resources:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {memory: 2Gi}
  hooks:
    argocd: {enabled: true}
    helm: {enabled: false}
