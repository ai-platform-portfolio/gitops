# The PreSync migration needs this account before the upstream chart's Sync phase.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: litellm
automountServiceAccountToken: false

---

# Key Vault is authoritative; the pod consumes an immutable local copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-keys
  namespace: litellm
spec:
  secretStoreRef: {name: azure-kv, kind: ClusterSecretStore}
  # Encryption-salt changes require coordinated migration, never silent rotation.
  refreshPolicy: CreatedOnce
  target:
    name: litellm-keys
    creationPolicy: Orphan
    immutable: true
  data:
    - secretKey: master-key
      remoteRef:
        key: platform-{{ .Values.cluster.name }}-litellm-master
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: platform-{{ .Values.cluster.name }}-litellm-salt

{{- if .Values.litellm.azure.enabled }}
---
# Reuse the existing ASO bootstrap identity; these IDs are login metadata,
# not a new identity or a long-lived credential.
apiVersion: v1
kind: Secret
metadata:
  name: aso-credential
  namespace: litellm
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
type: Opaque
data:
  AZURE_CLIENT_ID: {{ required "runtime.ASO_CLIENT_ID is required" .Values.runtime.ASO_CLIENT_ID | b64enc | quote }}
  AZURE_TENANT_ID: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | b64enc | quote }}
  AZURE_SUBSCRIPTION_ID: {{ required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID | b64enc | quote }}
  USE_WORKLOAD_IDENTITY_AUTH: {{ "true" | b64enc | quote }}
{{- end }}

{{- if .Values.litellm.access.enabled }}
---
# Public metadata for native hosted delivery; secrets remain in Key Vault.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-consumer-defaults
  namespace: litellm
data:
  values.json: {{ toJson (dict "modelGateway" (dict "endpoint" (printf "https://%s/v1" (tpl .Values.litellm.access.hostname .)) "vaultUri" (trimSuffix "/" .Values.runtime.AZURE_KEY_VAULT_URI) "masterSecret" (printf "platform-%s-litellm-master" .Values.cluster.name) "namespace" "litellm" "issuerServiceAccount" "litellm-key-writer" "issuerIdentitySecret" "litellm-key-writer" "image" (printf "%s:%s" .Values.litellm.image.repository .Values.litellm.image.tag) "policies" .Values.litellm.access.policies) "azure" (dict "subscriptionId" .Values.runtime.AZURE_SUBSCRIPTION_ID "tenantId" .Values.runtime.AZURE_TENANT_ID "resourceNamespace" "azure-resources" "keyVault" (dict "name" (first (splitList "." (trimPrefix "https://" .Values.runtime.AZURE_KEY_VAULT_URI))) "resourceGroup" .Values.litellm.keyVault.resourceGroup))) | quote }}
{{- end }}
