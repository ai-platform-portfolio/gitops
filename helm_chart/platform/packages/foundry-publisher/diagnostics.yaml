{{- $p := .Values.foundryPublisher -}}
{{- $sub := required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID -}}
{{- $group := required "runtime.CLUSTER_RESOURCE_GROUP is required" .Values.runtime.CLUSTER_RESOURCE_GROUP -}}
{{- $project := printf "/subscriptions/%s/resourceGroups/%s/providers/Microsoft.CognitiveServices/accounts/%s/projects/%s" $sub (required "foundryPublisher.resourceGroup is required" $p.resourceGroup) (include "platform.foundryName" .) (required "foundryPublisher.project is required" $p.project) -}}
{{- $hash := sha256sum (printf "foundry-diagnostic-broker/%s/%s" .Values.cluster.name $project) | trunc 32 -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foundry-diagnostic-broker
  namespace: foundry-publisher

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: foundry-diagnostic-broker
  namespace: foundry-publisher
data:
  tenantId: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | quote }}
  projectEndpoint: {{ printf "https://%s.services.ai.azure.com/api/projects/%s" (include "platform.foundryName" .) $p.project | quote }}

---
# The Job chart creates a short-lived RoleBinding in its approved namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: foundry-diagnostic-broker-read
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]

  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]

  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]

  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [get]

---
apiVersion: managedidentity.azure.com/v1api20230131
kind: UserAssignedIdentity
metadata:
  name: foundry-diagnostic-broker
  namespace: azure-resources
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  azureName: id-{{ .Values.cluster.name }}-foundry-diagnostic-broker
  location: {{ required "foundryPublisher.location is required" $p.location | quote }}
  owner: {armId: {{ printf "/subscriptions/%s/resourceGroups/%s" $sub $group | quote }}}
  operatorSpec:
    configMaps:
      clientId:
        name: foundry-diagnostic-broker-identity
        key: clientId
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "^foundry-publisher$"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "^foundry-publisher$"
      principalId: {name: foundry-diagnostic-broker-identity, key: principalId}

---
apiVersion: managedidentity.azure.com/v1api20230131
kind: FederatedIdentityCredential
metadata:
  name: foundry-diagnostic-broker
  namespace: azure-resources
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  owner: {name: foundry-diagnostic-broker}
  audiences: [api://AzureADTokenExchange]
  issuer: {{ required "runtime.AKS_OIDC_ISSUER_URL is required" .Values.runtime.AKS_OIDC_ISSUER_URL | quote }}
  subject: system:serviceaccount:foundry-publisher:foundry-diagnostic-broker

---
apiVersion: authorization.azure.com/v1api20220401
kind: RoleAssignment
metadata:
  name: foundry-diagnostic-broker-user-{{ $hash | trunc 12 }}
  namespace: azure-resources
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  azureName: {{ printf "%s-%s-%s-%s-%s" (substr 0 8 $hash) (substr 8 12 $hash) (substr 12 16 $hash) (substr 16 20 $hash) (substr 20 32 $hash) | quote }}
  owner: {armId: {{ $project | quote }} }
  principalIdFromConfig: {name: foundry-diagnostic-broker-identity, key: principalId}
  principalType: ServicePrincipal
  roleDefinitionReference: {wellKnownName: Foundry User}

---
# Coding uses a distinct Foundry principal; the diagnostic broker never gets
# source-editing or GitHub publication credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foundry-coding-worker
  namespace: foundry-publisher

---
apiVersion: managedidentity.azure.com/v1api20230131
kind: UserAssignedIdentity
metadata:
  name: foundry-coding-worker
  namespace: azure-resources
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  azureName: id-{{ .Values.cluster.name }}-foundry-coding-worker
  location: {{ required "foundryPublisher.location is required" $p.location | quote }}
  owner: {armId: {{ printf "/subscriptions/%s/resourceGroups/%s" $sub $group | quote }}}
  operatorSpec:
    configMaps:
      clientId:
        name: foundry-coding-worker-identity
        key: clientId
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "^foundry-publisher$"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "^foundry-publisher$"
      principalId: {name: foundry-coding-worker-identity, key: principalId}

---
apiVersion: managedidentity.azure.com/v1api20230131
kind: FederatedIdentityCredential
metadata:
  name: foundry-coding-worker
  namespace: azure-resources
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  owner: {name: foundry-coding-worker}
  audiences: [api://AzureADTokenExchange]
  issuer: {{ required "runtime.AKS_OIDC_ISSUER_URL is required" .Values.runtime.AKS_OIDC_ISSUER_URL | quote }}
  subject: system:serviceaccount:foundry-publisher:foundry-coding-worker

---
{{- $codingHash := sha256sum (printf "foundry-coding-worker/%s/%s" .Values.cluster.name $project) | trunc 32 -}}
apiVersion: authorization.azure.com/v1api20220401
kind: RoleAssignment
metadata:
  name: foundry-coding-worker-user-{{ $codingHash | trunc 12 }}
  namespace: azure-resources
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  azureName: {{ printf "%s-%s-%s-%s-%s" (substr 0 8 $codingHash) (substr 8 12 $codingHash) (substr 12 16 $codingHash) (substr 16 20 $codingHash) (substr 20 32 $codingHash) | quote }}
  owner: {armId: {{ $project | quote }} }
  principalIdFromConfig: {name: foundry-coding-worker-identity, key: principalId}
  principalType: ServicePrincipal
  roleDefinitionReference: {wellKnownName: Foundry User}
