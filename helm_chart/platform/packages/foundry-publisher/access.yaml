apiVersion: v1
kind: ServiceAccount
metadata:
  name: foundry-publisher
  namespace: foundry-publisher

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: foundry-publisher
  namespace: foundry-publisher
data:
  tenantId: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | quote }}
  projectEndpoint: {{ printf "https://%s.services.ai.azure.com/api/projects/%s" (include "platform.foundryName" .) .Values.foundryPublisher.project | quote }}
