{{- $p := .Values.foundryPublisher -}}
{{- $sub := required "runtime.AZURE_SUBSCRIPTION_ID is required" .Values.runtime.AZURE_SUBSCRIPTION_ID -}}
{{- $clusterGroup := required "runtime.CLUSTER_RESOURCE_GROUP is required" .Values.runtime.CLUSTER_RESOURCE_GROUP -}}
{{- $projectScope := printf "/subscriptions/%s/resourceGroups/%s/providers/Microsoft.CognitiveServices/accounts/%s/projects/%s" $sub (required "foundryPublisher.resourceGroup is required" $p.resourceGroup) (required "foundryPublisher.account is required" $p.account) (required "foundryPublisher.project is required" $p.project) -}}
{{- $hash := sha256sum (printf "foundry-publisher/%s/%s" .Values.cluster.name $projectScope) | trunc 32 -}}
apiVersion: managedidentity.azure.com/v1api20230131
kind: UserAssignedIdentity
metadata:
  name: foundry-publisher
  namespace: azure-resources
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  azureName: id-{{ .Values.cluster.name }}-foundry-publisher
  location: {{ required "foundryPublisher.location is required" $p.location | quote }}
  owner: {armId: {{ printf "/subscriptions/%s/resourceGroups/%s" $sub $clusterGroup | quote }}}
  operatorSpec:
    configMaps:
      clientId:
        name: foundry-publisher-identity
        key: clientId
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "^foundry-publisher$"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "^foundry-publisher$"
      principalId: {name: foundry-publisher-identity, key: principalId}

---
apiVersion: managedidentity.azure.com/v1api20230131
kind: FederatedIdentityCredential
metadata:
  name: foundry-publisher
  namespace: azure-resources
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  owner: {name: foundry-publisher}
  audiences: [api://AzureADTokenExchange]
  issuer: {{ required "runtime.AKS_OIDC_ISSUER_URL is required" .Values.runtime.AKS_OIDC_ISSUER_URL | quote }}
  subject: system:serviceaccount:foundry-publisher:foundry-publisher

---
apiVersion: authorization.azure.com/v1api20220401
kind: RoleAssignment
metadata:
  name: foundry-publisher-project-manager
  namespace: azure-resources
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  azureName: {{ printf "%s-%s-%s-%s-%s" (substr 0 8 $hash) (substr 8 12 $hash) (substr 12 16 $hash) (substr 16 20 $hash) (substr 20 32 $hash) | quote }}
  owner: {armId: {{ $projectScope | quote }}}
  principalIdFromConfig: {name: foundry-publisher-identity, key: principalId}
  principalType: ServicePrincipal
  roleDefinitionReference: {wellKnownName: Foundry Project Manager}
