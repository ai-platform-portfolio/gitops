# Preserve existing credential bytes during adoption and ExternalSecret recreation.
# Immutable orphan targets use ESO native create-once behavior; no bootstrap writes.

apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: sonarqube-role
  namespace: postgres
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-role
  namespace: postgres
spec:
  refreshPolicy: CreatedOnce
  target:
    name: sonarqube-role
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "sonarqube"
        password: {{ `{{ .password }}` | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: sonarqube-role

---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: sonarqube-monitoring
  namespace: sonarqube
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-monitoring
  namespace: sonarqube
spec:
  refreshPolicy: CreatedOnce
  target:
    name: sonarqube-monitoring
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: Opaque
      data:
        passcode: {{ `{{ .password }}` | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: sonarqube-monitoring

---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: sonarqube-admin
  namespace: sonarqube
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-admin
  namespace: sonarqube
spec:
  refreshPolicy: CreatedOnce
  target:
    name: sonarqube-admin
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: Opaque
      data:
        password: {{ `Aa1_{{ .password }}` | quote }}
        currentPassword: "admin"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: sonarqube-admin
