{{- $script := tpl (.Files.Get "packages/sonarqube/configure.sh") . -}}
{{- $definition := .Files.Get "packages/sonarqube/configure-job.yaml" -}}
apiVersion: batch/v1
kind: Job
metadata:
  # A normal Job triggers auto-sync. Hash both the template and rendered script
  # so any configuration change creates a new Job instead of patching an immutable one.
  name: sonarqube-configure-{{ printf "%s\n%s" $definition $script | sha256sum | trunc 12 }}
  namespace: sonarqube
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: configure
        image: curlimages/curl:8.12.1
        command:
        - sh
        - -ec
        - |
{{ $script | indent 10 }}
        env:
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sonarqube-admin
              key: password
        - name: CURRENT_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sonarqube-admin
              key: currentPassword
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
