apiVersion: v1
kind: ConfigMap
metadata:
  name: devlake-ui
  namespace: devlake
data:
  default.conf: |
    map "$request_method:$http_origin" $devlake_reject_origin {
      default 0;
      ~^(POST|PUT|PATCH|DELETE):https://devlake\.{{ .Values.runtime.DNS_ZONE | replace "." "\\." }}$ 0;
      ~^(POST|PUT|PATCH|DELETE): 1;
    }
    server {
      listen 4000;
      server_name _;
      absolute_redirect off;
      client_max_body_size 2m;
      root /usr/share/nginx/html;
      auth_basic "DevLake administration";
      auth_basic_user_file /etc/devlake-auth/.htpasswd;

      location / { try_files $uri /index.html; }
      location = /health { auth_basic off; access_log off; return 200; }
      location = /api/proceed-db-migration { return 404; }
      location /api/rest/ {
        auth_basic off;
        proxy_pass http://devlake:8080/rest/;
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
      }
      location /api/ {
        if ($devlake_reject_origin) { return 403; }
        proxy_pass http://devlake:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-User-Secret "";
        proxy_read_timeout 60s;
      }
      location /grafana/ { return 302 https://grafana.{{ .Values.runtime.DNS_ZONE }}/; }
    }
