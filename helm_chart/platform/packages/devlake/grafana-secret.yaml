# ESO assumes this service account via TokenRequest; it is not used by the
# portal pods and receives no Azure or cluster-wide secret-reading permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devlake-grafana-secret-reader
  namespace: lgtm
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devlake-grafana-secret-reader
  namespace: postgres
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [devlake-grafana-role, platform-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devlake-grafana-secret-reader
  namespace: postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devlake-grafana-secret-reader
subjects:
  - kind: ServiceAccount
    name: devlake-grafana-secret-reader
    namespace: lgtm
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: devlake-grafana-postgres
  namespace: lgtm
spec:
  provider:
    kubernetes:
      remoteNamespace: postgres
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: devlake-grafana-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devlake-grafana-database
  namespace: lgtm
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: devlake-grafana-postgres
    kind: SecretStore
  target:
    name: devlake-grafana-database
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DEVLAKE_POSTGRES_PASSWORD: {{ `{{ .password }}` | quote }}
        DEVLAKE_POSTGRES_CA: {{ `{{ index . "ca.crt" }}` | quote }}
  data:
    - secretKey: password
      remoteRef: {key: devlake-grafana-role, property: password}
    - secretKey: ca.crt
      remoteRef: {key: platform-ca, property: ca.crt}
