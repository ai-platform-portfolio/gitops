# ESO assumes this service account via TokenRequest; it is not used by the
# portal pods and receives no Azure or cluster-wide secret-reading permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devlake-secret-reader
  namespace: devlake
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devlake-secret-reader
  namespace: postgres
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [devlake-role, platform-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devlake-secret-reader
  namespace: postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devlake-secret-reader
subjects:
  - kind: ServiceAccount
    name: devlake-secret-reader
    namespace: devlake
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: devlake-postgres
  namespace: devlake
spec:
  provider:
    kubernetes:
      remoteNamespace: postgres
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: devlake-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devlake-database
  namespace: devlake
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: devlake-postgres
    kind: SecretStore
  target:
    name: devlake-database
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        password: {{ `{{ .password }}` | quote }}
        ca.crt: {{ `{{ index . "ca.crt" }}` | quote }}
        DB_URL: {{ `postgres://devlake:{{ .password }}@platform-rw.postgres.svc.cluster.local:5432/devlake?sslmode=verify-full&sslrootcert=/etc/postgres/ca.crt` | quote }}
  data:
    - secretKey: password
      remoteRef: {key: devlake-role, property: password}
    - secretKey: ca.crt
      remoteRef: {key: platform-ca, property: ca.crt}
