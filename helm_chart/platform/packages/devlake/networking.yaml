apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: public
  namespace: devlake
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-azuredns
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    namespace: envoy-gateway-system
  listeners:
  - name: https
    hostname: devlake.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: devlake-tls
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devlake
  namespace: devlake
spec:
  hostnames:
  - devlake.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
  parentRefs:
  - name: public
    namespace: devlake
    sectionName: https
    kind: ListenerSet
    group: gateway.networking.k8s.io
  rules:
  - backendRefs:
    - name: devlake-ui
      port: 4000
    filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.envoyproxy.io
          kind: HTTPRouteFilter
          name: devlake-admin-credential
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: devlake
spec:
  hostnames:
  - devlake.{{ required "runtime.DNS_ZONE is required" .Values.runtime.DNS_ZONE }}
  parentRefs:
  - name: public
    namespace: envoy-gateway-system
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devlake-ingestion
  namespace: devlake
spec:
  hostnames:
    - devlake.{{ .Values.runtime.DNS_ZONE }}
  parentRefs:
    - {name: public, namespace: devlake, sectionName: https, kind: ListenerSet, group: gateway.networking.k8s.io}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/rest/plugins/webhook/}
      backendRefs:
        - {name: devlake-ui, port: 4000}
---
# Run after routes exist: gating this on the earlier policy stage would deadlock
# because SecurityPolicy has no target to accept until its HTTPRoute exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: devlake-access-{{ printf "%s%s%s%s%s" (.Files.Get "packages/devlake/networking.yaml") (.Files.Get "packages/devlake/verify-access.py") (toJson .Values.devlake) .Values.runtime.DNS_ZONE .Values.runtime.AZURE_TENANT_ID | sha256sum | trunc 12 }}
  namespace: devlake
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devlake-access
    spec:
      serviceAccountName: devlake-access
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1010
        runAsGroup: 1010
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: verify
          image: apache/devlake:v1.0.2@sha256:bae4e753959584b152fd2d66b2b13c4bc6c5ce02b9bd7c4a000e3e1296b09343
          command: [python3, /config/verify-access.py]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: devlake-configure
