apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: devlake-automation
  namespace: devlake
spec:
  length: 64
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devlake-automation
  namespace: devlake
spec:
  refreshPolicy: CreatedOnce
  target:
    name: devlake-automation
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        .htpasswd: {{ `{{ htpasswd "platform-admin" .password }}` | quote }}
        credential: {{ `Basic {{ printf "platform-admin:%s" .password | b64enc }}` | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: devlake-automation
