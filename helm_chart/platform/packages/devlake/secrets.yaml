apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: devlake-role
  namespace: postgres
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devlake-role
  namespace: postgres
spec:
  refreshPolicy: CreatedOnce
  target:
    name: devlake-role
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: devlake
        password: {{ `{{ .password }}` | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: devlake-role
---
