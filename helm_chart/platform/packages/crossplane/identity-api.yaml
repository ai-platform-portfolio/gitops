apiVersion: azuread.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: platform
spec:
  credentials:
    source: OIDCTokenFile
  clientID: {{ required "runtime.CROSSPLANE_CLIENT_ID is required" .Values.runtime.CROSSPLANE_CLIENT_ID | quote }}
  tenantID: {{ required "runtime.AZURE_TENANT_ID is required" .Values.runtime.AZURE_TENANT_ID | quote }}
  # Own this projection rather than depending on an AKS webhook mount path.
  oidcTokenFilePath: /var/run/secrets/crossplane/azure/token
---
# A namespaced API combines a registration, principal and connection Secret.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: oidcapplications.identity.platform.ai-platform-portfolio
spec:
  scope: Namespaced
  group: identity.platform.ai-platform-portfolio
  names:
    kind: OIDCApplication
    plural: oidcapplications
  defaultCompositionRef:
    name: entra-oidc
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [displayName, redirectUri, tenantId, ownerId, credentialValidityDays]
              properties:
                displayName: { type: string, minLength: 1 }
                redirectUri: { type: string, pattern: '^https://' }
                tenantId: { type: string, minLength: 1 }
                ownerId: { type: string, minLength: 1 }
                credentialValidityDays: { type: integer, minimum: 30, maximum: 365 }
                requiredResourceAccess:
                  type: array
                  items:
                    type: object
                    required: [resourceAppId, resourceAccess]
                    properties:
                      resourceAppId: { type: string }
                      resourceAccess:
                        type: array
                        items:
                          type: object
                          required: [id, type]
                          properties:
                            id: { type: string }
                            type: { type: string, enum: [Scope, Role] }

---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: entra-oidc
spec:
  compositeTypeRef:
    apiVersion: identity.platform.ai-platform-portfolio/v1alpha1
    kind: OIDCApplication
  mode: Pipeline
  pipeline:
    - step: identity
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        # The function composes this Secret in the XR's namespace, never Argo values.
        writeConnectionSecretToRef:
          patches:
            - type: FromCompositeFieldPath
              fromFieldPath: metadata.name
              toFieldPath: name
        resources:
          - name: application
            base:
              apiVersion: applications.azuread.m.upbound.io/v1beta1
              kind: Application
              spec:
                providerConfigRef: { name: platform, kind: ClusterProviderConfig }
                forProvider:
                  signInAudience: AzureADMyOrg
                  preventDuplicateNames: true
                  optionalClaims:
                    idToken:
                      - name: email
                        essential: true
            patches:
              # Declares requested scopes; it does not grant API consent.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.requiredResourceAccess
                toFieldPath: spec.forProvider.requiredResourceAccess
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.displayName
                toFieldPath: spec.forProvider.displayName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.redirectUri
                toFieldPath: spec.forProvider.web.redirectUris[0]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.ownerId
                toFieldPath: spec.forProvider.owners[0]
            connectionDetails:
              - name: client-id
                type: FromFieldPath
                fromFieldPath: status.atProvider.clientId

          - name: principal
            base:
              apiVersion: serviceprincipals.azuread.m.upbound.io/v1beta1
              kind: Principal
              spec:
                providerConfigRef: { name: platform, kind: ClusterProviderConfig }
                forProvider:
                  appRoleAssignmentRequired: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.clientIdRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.ownerId
                toFieldPath: spec.forProvider.owners[0]

          - name: password
            base:
              apiVersion: applications.azuread.m.upbound.io/v1beta1
              kind: Password
              spec:
                providerConfigRef: { name: platform, kind: ClusterProviderConfig }
                forProvider:
                  displayName: GitOps OIDC
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.applicationIdRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: '%s-password'
              - type: FromCompositeFieldPath
                fromFieldPath: spec.credentialValidityDays
                toFieldPath: spec.forProvider.endDateRelative
                transforms:
                  - type: math
                    math: { type: Multiply, multiply: 24 }
                  - type: string
                    string: { type: Format, fmt: '%.0fh' }
              # Public tenant context joins the aggregate credential Secret.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.annotations[platform-tenant]
            connectionDetails:
              - name: client-secret
                type: FromConnectionSecretKey
                fromConnectionSecretKey: attribute.value
              - name: tenant-id
                type: FromFieldPath
                fromFieldPath: metadata.annotations[platform-tenant]
