apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
  {{- if .Values.gateway.preview.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ required "gateway.preview.clusterIssuer is required" .Values.gateway.preview.clusterIssuer | quote }}
  {{- end }}
spec:
  gatewayClassName: envoy
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          gitops.platform/gateway: public
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gitops.platform/gateway: public
  {{- if .Values.gateway.preview.enabled }}
  {{- $preview := .Values.gateway.preview }}
  {{- $hostname := tpl (required "gateway.preview.hostname is required" $preview.hostname) . }}
  {{- if not (regexMatch `^\*\.[a-z0-9]([a-z0-9.-]*[a-z0-9])?$` $hostname) }}
  {{- fail "gateway.preview.hostname must be a wildcard DNS hostname" }}
  {{- end }}
  - name: {{ required "gateway.preview.listenerName is required" $preview.listenerName | quote }}
    hostname: {{ $hostname | quote }}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ required "gateway.preview.certificateSecret is required" $preview.certificateSecret | quote }}
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gitops.platform/gateway: public
            gitops.platform/preview: "true"
  {{- end }}

{{- if .Values.gateway.private.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: private
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          service.beta.kubernetes.io/azure-load-balancer-internal: "true"
        loadBalancerSourceRanges:
{{ required "gateway.private.sourceRanges must restrict private ingress" .Values.gateway.private.sourceRanges | toYaml | indent 10 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: {{ required "gateway.private.clusterIssuer is required" .Values.gateway.private.clusterIssuer | quote }}
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: private
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          gitops.platform/gateway: private
  # Installed Gateway API requires a base listener. Cert-manager manages its TLS;
  # additional shared packages can attach their own issuer-annotated ListenerSets.
  listeners:
  - name: otlp-https
    hostname: {{ tpl (required "gateway.private.hostname is required" .Values.gateway.private.hostname) . | quote }}
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: otel-private-tls
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gitops.platform/gateway: private
{{- if and .Values.litellm.enabled .Values.litellm.access.enabled }}
{{- $service := "private-envoy-internal" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service }}
  namespace: envoy-gateway-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: proxy
    gateway.envoyproxy.io/owning-gateway-name: private
    gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
  ports:
    - name: https
      port: 443
      targetPort: 10443 # Envoy Gateway's container port for the HTTPS listener.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  model-gateway.override: |
    rewrite name exact {{ tpl .Values.litellm.access.hostname . }} {{ $service }}.envoy-gateway-system.svc.cluster.local
{{- end }}
{{- end }}
