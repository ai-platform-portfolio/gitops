{{- if eq .Values.cluster.role "management" }}
{{- range $path, $contents := .Files.Glob "clusters/*/profile.yaml" }}
{{- $profile := fromYaml (toString $contents) }}
{{- $name := required (printf "%s must declare cluster.name" $path) (dig "cluster" "name" "" $profile) }}
{{- if not (regexMatch "^aks-[a-z0-9]+(?:-[a-z0-9]+)*$" $name) }}
{{- fail (printf "%s has an invalid cluster name" $path) }}
{{- end }}
{{- if ne (base (dir $path)) $name }}
{{- fail (printf "%s directory must equal cluster.name" $path) }}
{{- end }}
{{- if ne (dig "cluster" "role" "" $profile) "workload" }}
{{- fail (printf "%s must set cluster.role=workload" $path) }}
{{- end }}
{{- if ne (dig "cluster" "resourceGroup" "" $profile) (printf "rg-%s" $name) }}
{{- fail (printf "%s resource group must derive from cluster.name" $path) }}
{{- end }}
{{- if not (regexMatch "^AI-[0-9]+$" (dig "request" "issue" "" $profile)) }}
{{- fail (printf "%s must link a Linear AI issue" $path) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-request-{{ $name }}
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/workload-request: "true"
    platform.ai-platform-portfolio/cluster: {{ $name }}
data:
  profile.yaml: |
{{ toYaml $profile | indent 4 }}
{{- if $.Values.clusterOnboarding.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: onboard-{{ $name }}
  namespace: cluster-onboarding
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  eventBusName: onboarding
  template:
    serviceAccountName: onboarding-sensor
    nodeSelector:
      agentpool: platform
    container:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
  dependencies:
    - name: applied
      eventSourceName: atlantis
      eventName: apply
      filters:
        data:
          - path: body.Success
            type: bool
            value: ["true"]
          - path: body.Repo.FullName
            type: string
            value: [{{ printf "^%s$" (regexQuoteMeta (required "clusterOnboarding.repository is required" $.Values.clusterOnboarding.repository)) | quote }}]
          - path: body.Directory
            type: string
            value: [{{ printf "^clusters/%s$" (regexQuoteMeta $name) | quote }}]
          - path: body.Workspace
            type: string
            value: ["^default$"]
  triggers:
    - retryStrategy:
        steps: 5
        duration: 1s
        factor: 2
      template:
        name: onboard
        k8s:
          # Native update creates an absent Job and preserves an existing one.
          # One stable name per cluster coalesces signals while onboarding runs.
          operation: update
          source:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: onboard-{{ $name }}
                namespace: cluster-onboarding
                labels:
                  platform.ai-platform-portfolio/cluster: {{ $name }}
              spec:
                activeDeadlineSeconds: 28800
                backoffLimit: 2
                # Release the name when finished; logs remain in shared logging.
                ttlSecondsAfterFinished: 0
                template:
                  metadata:
                    labels:
                      azure.workload.identity/use: "true"
                  spec:
                    serviceAccountName: cluster-onboarding
                    restartPolicy: Never
                    nodeSelector:
                      agentpool: platform
                    containers:
                      - name: worker
                        image: {{ required "clusterOnboarding.image is required" $.Values.clusterOnboarding.image | quote }}
                        imagePullPolicy: IfNotPresent
                        env:
                          - name: CLUSTER_NAME
                            value: {{ $name | quote }}
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          runAsNonRoot: true
                          capabilities:
                            drop: [ALL]
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                        resources:
                          requests: {cpu: 50m, memory: 256Mi}
                          limits: {memory: 768Mi}
                    volumes:
                      - name: tmp
                        emptyDir: {}
{{- end }}
{{- end }}
{{- end }}
