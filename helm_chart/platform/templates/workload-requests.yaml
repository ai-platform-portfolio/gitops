{{- if eq .Values.cluster.role "management" }}
{{- range $path, $contents := .Files.Glob "clusters/*/profile.yaml" }}
{{- $profile := fromYaml (toString $contents) }}
{{- $name := required (printf "%s must declare cluster.name" $path) (dig "cluster" "name" "" $profile) }}
{{- if not (regexMatch "^aks-[a-z0-9]+(?:-[a-z0-9]+)*$" $name) }}
{{- fail (printf "%s has an invalid cluster name" $path) }}
{{- end }}
{{- if ne (base (dir $path)) $name }}
{{- fail (printf "%s directory must equal cluster.name" $path) }}
{{- end }}
{{- if ne (dig "cluster" "role" "" $profile) "workload" }}
{{- fail (printf "%s must set cluster.role=workload" $path) }}
{{- end }}
{{- if ne (dig "cluster" "resourceGroup" "" $profile) (printf "rg-%s" $name) }}
{{- fail (printf "%s resource group must derive from cluster.name" $path) }}
{{- end }}
{{- if not (regexMatch "^AI-[0-9]+$" (dig "request" "issue" "" $profile)) }}
{{- fail (printf "%s must link a Linear AI issue" $path) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-request-{{ $name }}
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/workload-request: "true"
    platform.ai-platform-portfolio/cluster: {{ $name }}
data:
  profile.yaml: |
{{ toYaml $profile | indent 4 }}
{{- if $.Values.clusterOnboarding.enabled }}
{{- if not $.Values.events.enabled }}
{{- fail "clusterOnboarding.enabled requires events.enabled on management" }}
{{- end }}
---
{{- $spec := tpl ($.Files.Get "packages/cluster-onboarding/sensor.yaml") (dict "Values" $.Values "Template" $.Template "clusterName" $name) | fromYaml }}
{{ include "platform.eventSensor" (dict "name" (printf "onboard-%s" $name) "spec" $spec) }}
{{- end }}
{{- end }}
{{- end }}
