# Install foundational controllers and management onboarding.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.12.0"
    helm:
      releaseName: external-secrets
      valuesObject:
{{ tpl (.Files.Get "packages/external-secrets/values.yaml") . | indent 8 }}

{{ include "platform.syncPolicy" . | indent 2 }}
