{{- if and (eq .Values.cluster.role "management") .Values.foundryPublisher.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundry-publisher
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: azure-resources

  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/foundry-publisher/access.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/foundry-publisher/azure-resources.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/foundry-publisher/diagnostics.yaml") . | indent 10 }}

{{ include "platform.syncPolicy" . | indent 2 }}
{{- end }}
