  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/devlake/collection.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/devlake/sso-policy.yaml") . | indent 10 }}

{{ include "platform.syncPolicy" . | indent 2 }}
---
# Scoped credential/configuration reloads, installed before the portal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devlake-reloader
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: devlake

  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: "2.2.18"
    helm:
      releaseName: devlake-reloader
      valuesObject:
        reloader:
          watchGlobally: false
          ignoreJobs: true
          ignoreCronJobs: true
          reloadStrategy: annotations
          deployment:
            containerSecurityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }

{{ include "platform.syncPolicy" . | indent 2 }}
{{- end }}
