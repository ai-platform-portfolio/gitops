# Observability backends are ready for collectors and application packages.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse

  source:
    repoURL: https://langfuse.github.io/langfuse-k8s
    chart: langfuse
    targetRevision: "2.1.4"
    helm:
      releaseName: langfuse
      apiVersions:
        - clickhouse.com/v1alpha1/ClickHouseCluster
        - clickhouse.com/v1alpha1/KeeperCluster
      valuesObject:
{{ tpl (.Files.Get "packages/langfuse/values.yaml") . | indent 8 }}

{{- $policy := include "platform.syncPolicy" . | fromYaml }}
{{- if .Values.langfuse.sso.enabled }}
{{- /* Preserve only Reloader's restart marker; all other workload drift stays visible. */}}
{{- $reload := dict "group" "apps" "kind" "Deployment" "name" "langfuse-web" "namespace" "langfuse" "jsonPointers" (list "/spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from") }}
{{- $_ := set $policy "ignoreDifferences" (append $policy.ignoreDifferences $reload) }}
{{- end }}
{{ toYaml $policy | indent 2 }}

---
# Identity dependencies reconcile before the Langfuse workload above.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse-reloader
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse

  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: "2.2.18"
    helm:
      releaseName: langfuse-reloader
      valuesObject:
        reloader:
          watchGlobally: false
          ignoreConfigMaps: true
          ignoreJobs: true
          ignoreCronJobs: true
          reloadStrategy: annotations
          deployment:
            containerSecurityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }

{{ include "platform.syncPolicy" . | indent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-identities
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse

  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/langfuse/identity.yaml") . | indent 10 }}
{{- if .Values.devlake.enabled }}
          ---
{{ tpl (.Files.Get "packages/devlake/identity.yaml") . | indent 10 }}
{{- end }}
{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
          ---
{{ tpl (.Files.Get "packages/backstage/identity.yaml") . | indent 10 }}
{{- end }}

{{ include "platform.syncPolicy" . | indent 2 }}
