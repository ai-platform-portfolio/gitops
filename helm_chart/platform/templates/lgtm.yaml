---
# Storage and secret dependencies are ready for databases and observability.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: lgtm

  sources:
    # Replace only the eviction webhook in the final source.
    - repoURL: https://grafana.github.io/helm-charts
      chart: mimir-distributed
      targetRevision: "6.2.1"
      helm:
        releaseName: mimir
        valuesObject:
{{ (tpl (.Files.Get "packages/lgtm/values.yaml") . | fromYaml).mimir | toYaml | indent 10 }}
    - repoURL: {{ .Values.git.repository }}
      targetRevision: {{ .Values.git.revision | quote }}
      path: helm_chart/charts/resources
      helm:
        valuesObject:
          manifests: |
{{ .Files.Get "packages/lgtm/mimir-eviction.yaml" | indent 12 }}

{{ include "platform.syncPolicy" . | indent 2 }}
