# Shared configuration stage: controllers exist before their CRs are applied.
# Files live with their packages; this Application preserves the health gate.
# Controllers are available; install operators and shared configuration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: configuration
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/external-dns/azure-config.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/sonarqube/network-policy.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/external-secrets/secret-store.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/atlas/configuration.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/cert-manager/issuer.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/lgtm/service-account.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/lgtm/grafana-secret.yaml") . | indent 10 }}
{{ if .Values.holmes.enabled }}
          ---
{{ tpl (.Files.Get "packages/holmes/access.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/holmes/aso-credential.yaml") . | indent 10 }}
{{ end }}
          ---
{{ tpl (.Files.Get "packages/testkube/configuration.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/azure-service-operator/network-policy.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/azure-service-operator/application-credential.yaml") . | indent 10 }}

{{- if .Values.atlantis.enabled }}
          ---
{{ tpl (.Files.Get "packages/atlantis/secrets.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/atlantis/network-policy.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/atlantis/readiness-rbac.yaml") . | indent 10 }}
{{- end }}

{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
          ---
{{ tpl (.Files.Get "packages/backstage/secrets.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/backstage/network-policy.yaml") . | indent 10 }}
{{- end }}

{{- if .Values.devlake.enabled }}
          ---
{{ tpl (.Files.Get "packages/devlake/configuration.yaml") . | indent 10 }}
{{- end }}

{{ include "platform.syncPolicy" . | indent 2 }}
