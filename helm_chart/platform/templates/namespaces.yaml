# Namespace definitions live with their packages and are installed first.
# Create namespaces before package resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/langfuse/namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/clickhouse/namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/opentelemetry/namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/external-dns/namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/cert-manager/namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/envoy-gateway/namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/postgres/operator-namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/sonarqube/namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/external-secrets/namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/postgres/namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/lgtm/namespace.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/k8s-monitoring/namespace.yaml") . | indent 10 }}
{{ if eq .Values.cluster.role "management" }}
          ---
{{ tpl (.Files.Get "packages/azure-service-operator/namespace.yaml") . | indent 10 }}
{{ end }}

{{- if and (eq .Values.cluster.role "management") .Values.atlantis.enabled }}
          ---
{{ tpl (.Files.Get "packages/atlantis/namespace.yaml") . | indent 10 }}
{{- end }}

{{ include "platform.syncPolicy" . | indent 2 }}
