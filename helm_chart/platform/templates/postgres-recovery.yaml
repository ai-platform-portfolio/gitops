{{- if .Values.postgres.recovery.enabled }}
# The recovery server has its own ownership; the source remains a foundation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-recovery
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: azure-resources
  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/postgres-recovery/azure-resources.yaml") . | indent 10 }}

{{ include "platform.syncPolicy" . | indent 2 }}
{{- end }}
