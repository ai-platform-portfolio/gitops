{{- if eq .Values.profile "full" }}
# Observability backends are ready for collectors and application packages.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: "4.5.3"
    helm:
      releaseName: k8s-monitoring
      valuesObject:
{{ tpl (.Files.Get "packages/k8s-monitoring/values.yaml") . | indent 8 }}

{{ include "platform.syncPolicy" . | indent 2 }}

{{- end }}
