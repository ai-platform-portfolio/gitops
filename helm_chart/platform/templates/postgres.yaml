# Controllers are available; install operators and shared configuration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: "0.29.1"
    helm:
      releaseName: cloudnative-pg
      valuesObject:
{{ tpl (.Files.Get "packages/postgres/operator-values.yaml") . | indent 8 }}

{{ include "platform.syncPolicy" . | indent 2 }}

---
# Issuers and operators are ready for gateway, DNS and backup integration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-barman-cloud
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud
    targetRevision: "0.8.1"
    helm:
      releaseName: plugin-barman-cloud
      valuesObject:
{{ tpl (.Files.Get "packages/postgres/barman-values.yaml") . | indent 8 }}

{{ include "platform.syncPolicy" . | indent 2 }}

---
# Storage and secret dependencies are ready for databases and observability.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/postgres/backups.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/postgres/object-store.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/postgres/cluster.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/postgres/client-certificates.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/postgres/storage-class.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/postgres/pooler.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/postgres/network-policy.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/sonarqube/database.yaml") . | indent 10 }}

          ---
{{ tpl (.Files.Get "packages/testkube/database.yaml") . | indent 10 }}

{{- if and .Values.backstage.enabled (eq .Values.cluster.role "management") }}
          ---
{{ tpl (.Files.Get "packages/backstage/database.yaml") . | indent 10 }}
{{- end }}

{{- if .Values.devlake.enabled }}
          ---
{{ tpl (.Files.Get "packages/devlake/database.yaml") . | indent 10 }}
{{- end }}

{{ include "platform.syncPolicy" . | indent 2 }}
