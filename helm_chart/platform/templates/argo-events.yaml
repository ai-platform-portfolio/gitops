{{- if and (eq .Values.cluster.role "management") .Values.events.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-event-source
  namespace: cluster-onboarding
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-event-sensor
  namespace: cluster-onboarding
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-event-source
  namespace: cluster-onboarding
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-event-source
  namespace: cluster-onboarding
subjects:
  - kind: ServiceAccount
    name: platform-event-source
    namespace: cluster-onboarding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-event-source
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-event-sensor
  namespace: cluster-onboarding
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-event-sensor
  namespace: cluster-onboarding
subjects:
  - kind: ServiceAccount
    name: platform-event-sensor
    namespace: cluster-onboarding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-event-sensor
---
# Shared controller first; event resources are reconciled only after its CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-events
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cluster-onboarding

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-events
    targetRevision: "2.4.27"
    helm:
      releaseName: argo-events
      valuesObject:
        controller:
          rbac:
            namespaced: true
          nodeSelector:
            agentpool: platform
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 512Mi}
        configs:
          jetstream:
            streamConfig:
              replicas: 1
              maxBytes: 100MB
              maxAge: 168h

{{ include "platform.syncPolicy" . | indent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-events
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cluster-onboarding

  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/argo-events/eventbus.yaml") . | indent 10 }}
{{ tpl (.Files.Get "packages/cluster-onboarding/events.yaml") . | indent 10 }}
{{- $policy := include "platform.syncPolicy" . | fromYaml }}
{{- $ignored := $policy.ignoreDifferences }}
{{- if .Values.clusterOnboarding.enabled }}
{{- range $path, $contents := .Files.Glob "clusters/*/profile.yaml" }}
{{- $name := (fromYaml (toString $contents)).cluster.name }}
{{- $ignored = append $ignored (dict "group" "" "kind" "ConfigMap" "name" (printf "onboard-%s" $name) "namespace" "cluster-onboarding" "jsonPointers" (list "/data")) }}
{{- end }}
{{- end }}
{{- $_ := set $policy "ignoreDifferences" $ignored }}
  # Preserve producer-owned signal data as well as the normal platform diff rules.
{{ $policy | toYaml | indent 2 }}
{{- end }}
