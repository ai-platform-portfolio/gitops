{{- if .Values.atlantis.enabled }}
# ASO and its namespace credential are ready before Azure resources; the
# runner init container waits for current-generation Azure Ready conditions.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlantis-azure
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: atlantis

  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/atlantis/azure-resources.yaml") . | indent 10 }}

{{ include "platform.syncPolicy" . | indent 2 }}
{{- end }}
