# Install foundational controllers and management onboarding.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: "v1.9.2"
    helm:
      releaseName: envoy-gateway
      valuesObject:
{{ tpl (.Files.Get "packages/envoy-gateway/values.yaml") . | indent 8 }}

{{ include "platform.syncPolicy" . | indent 2 }}
