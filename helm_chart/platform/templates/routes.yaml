# Networking lives with each exposed application; attach it after backend health.
# Attach routes only after application backends are healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: routes
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "80"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/lgtm/networking.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/langfuse/networking.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/sonarqube/networking.yaml") . | indent 10 }}

{{- if and (eq .Values.cluster.role "management") .Values.atlantis.enabled }}
          ---
{{ tpl (.Files.Get "packages/atlantis/networking.yaml") . | indent 10 }}
{{- end }}

{{ include "platform.syncPolicy" . | indent 2 }}
