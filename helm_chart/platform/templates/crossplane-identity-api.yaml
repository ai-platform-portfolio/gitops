{{- if eq .Values.cluster.role "management" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-identity-api
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system

  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/crossplane/provider-config.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/crossplane/definition.yaml") . | indent 10 }}
          ---
{{ tpl (.Files.Get "packages/crossplane/composition.yaml") . | indent 10 }}

{{ include "platform.syncPolicy" . | indent 2 }}
{{- end }}
