{{- if eq .Values.profile "full" }}
# Observability backends are ready for collectors and application packages.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.175.1"
    helm:
      releaseName: opentelemetry-collector
      valuesObject:
{{ tpl (.Files.Get "packages/opentelemetry/values.yaml") . | indent 8 }}

{{ include "platform.syncPolicy" . | indent 2 }}

{{- end }}
