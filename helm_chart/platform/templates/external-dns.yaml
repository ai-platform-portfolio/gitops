# Issuers and operators are ready for gateway, DNS and backup integration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: "1.23.0"
    helm:
      releaseName: external-dns
      valuesObject:
{{ tpl (.Files.Get "packages/external-dns/values.yaml") . | indent 8 }}

{{ include "platform.syncPolicy" . | indent 2 }}
