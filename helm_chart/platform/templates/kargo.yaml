{{- if eq .Values.cluster.role "management" }}
# Crossplane creates the public Entra client before the API reads its client ID.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-identity
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo

  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision | quote }}
    path: helm_chart/charts/resources
    helm:
      valuesObject:
        manifests: |
{{ tpl (.Files.Get "packages/kargo/identity.yaml") . | indent 10 }}

{{ include "platform.syncPolicy" . | indent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo

  source:
    repoURL: ghcr.io/akuity/kargo-charts
    chart: kargo
    targetRevision: "1.12.5"
    helm:
      releaseName: kargo
      valuesObject:
{{ tpl (.Files.Get "packages/kargo/values.yaml") . | indent 8 }}

{{ include "platform.syncPolicy" . | indent 2 }}
{{- end }}
