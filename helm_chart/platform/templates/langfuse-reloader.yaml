{{- if eq .Values.cluster.role "management" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse-reloader
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse

  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: "2.2.18"
    helm:
      releaseName: langfuse-reloader
      valuesObject:
        reloader:
          watchGlobally: false
          ignoreConfigMaps: true
          ignoreJobs: true
          ignoreCronJobs: true
          reloadStrategy: annotations
          deployment:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }

{{ include "platform.syncPolicy" . | indent 2 }}
{{- end }}
