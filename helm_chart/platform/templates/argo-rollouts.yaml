# Gateway API CRDs exist before the traffic-routing controller starts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  labels:
    platform.ai-platform-portfolio/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: "2.43.8"
    helm:
      releaseName: argo-rollouts
      valuesObject:
{{ tpl (.Files.Get "packages/argo-rollouts/values.yaml") . | indent 8 }}

{{ include "platform.syncPolicy" . | indent 2 }}
