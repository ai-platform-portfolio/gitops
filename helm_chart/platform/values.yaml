cluster:
  name: management
  role: management

git:
  repository: https://github.com/ai-platform-portfolio/gitops.git
  revision: main

# Filled by scripts/cluster.py from Terraform outputs and authenticated context.
# Tenant/account context is supplied at runtime, not checked into values.
runtime: {}

# The lifecycle enables SonarQube after PostgreSQL is ready and its CA is copied.
sonarqubeReady: false

clusterOnboarding:
  enabled: true
  image: localacrk8s.azurecr.io/portfolio/cluster-onboarding@sha256:45fae1c039983cd446e5fd61a84cf1043dad97473052a9ad2052ad4c74aa22e9
  vaultResourceGroup: kubernetes

# Empty egress lists deny these destinations until each cluster's addresses are verified.
holmes:
  enabled: true
  model: azure/chat
  modelEndpoint: https://foundry-management-portfolio.cognitiveservices.azure.com/
  modelApiVersion: "2025-04-01-preview"
  modelCidrs: []
  apiCidrs: []
  entraCidrs: []

  azure:
    location: uksouth
    foundryResourceGroupName: rg-management
    foundryResourceName: foundry-management-portfolio

# Package choices live in GitOps, not Terraform/tfvars. Atlantis requires the
# dedicated App installation and Key Vault credentials before this PR merges.
atlantis:
  enabled: true

  github_app_id: "5471830"
  github_app_slug: ai-platform-clusters
  github_team: platform
  repositories:
    - github.com/ai-platform-portfolio/cluster-deployments

  azure:
    location: uksouth
    # ASO creates this package-owned group; do not select an existing/shared RG.
    identity_resource_group_name: rg-{{ .Values.cluster.name }}-atlantis
    # Map approved existing state/deployment targets to built-in Azure role names.
    # Example entries are documented in packages/atlantis/README.md.
    role_assignments:
      state:
        scope: storage_account
        resource_group_name: claudeaiportfolio
        storage_account_name: localtfsa
        role_definition_name: Storage Blob Data Contributor

      deployment:
        scope: subscription
        role_definition_name: Contributor

      delegation:
        scope: subscription
        role_definition_name: Role Based Access Control Administrator

      api-allowlist:
        scope: key_vault
        resource_group_name: kubernetes
        key_vault_name: localdevenv
        role_definition_name: Key Vault Secrets User


# Portfolio portal: native Entra identity and an immutable image are required.
backstage:
  enabled: true
  clusterRequests:
    enabled: true
  image: localacrk8s.azurecr.io/portfolio/backstage@sha256:a844cdab82c4cc995a43d532bc110475cef17a9ee2010b361f0b73a915e66602
  imagePullSecrets: []
  credentialValidityDays: 180
  users:
    portfolio-owner:
      objectId: 13d45074-e2b1-4c98-9c95-e246f2abb575
      displayName: Michaela Links
      memberOf: [platform-team]
  egress:
    # GitHub /meta API IPv4 ranges, retrieved 2026-10-25. Refresh on change.
    - to:
        - ipBlock: {cidr: 192.30.252.0/22}
        - ipBlock: {cidr: 185.199.108.0/22}
        - ipBlock: {cidr: 140.82.112.0/20}
        - ipBlock: {cidr: 143.55.64.0/20}
        - ipBlock: {cidr: 20.201.28.148/32}
        - ipBlock: {cidr: 20.205.243.168/32}
        - ipBlock: {cidr: 20.87.245.6/32}
        - ipBlock: {cidr: 4.237.22.34/32}
        - ipBlock: {cidr: 4.228.31.149/32}
        - ipBlock: {cidr: 20.207.73.85/32}
        - ipBlock: {cidr: 20.27.177.116/32}
        - ipBlock: {cidr: 20.200.245.245/32}
        - ipBlock: {cidr: 20.175.192.149/32}
        - ipBlock: {cidr: 20.233.83.146/32}
        - ipBlock: {cidr: 20.29.134.17/32}
        - ipBlock: {cidr: 20.199.39.228/32}
        - ipBlock: {cidr: 20.217.135.0/32}
        - ipBlock: {cidr: 4.225.11.201/32}
        - ipBlock: {cidr: 20.250.119.72/32}
        - ipBlock: {cidr: 4.208.26.200/32}
        - ipBlock: {cidr: 20.26.156.210/32}
        - ipBlock: {cidr: 172.182.252.137/32}
        - ipBlock: {cidr: 4.249.131.166/32}
        - ipBlock: {cidr: 48.202.248.39/32}
        - ipBlock: {cidr: 48.204.201.2/32}
      ports:
        - {protocol: TCP, port: 443}

# Native Microsoft sign-in, owned by each cluster's AzureAD provider.
langfuse:
  sso:
    enabled: true
    # Keep recovery login until the profile email and browser SSO are verified.
    disableUsernamePassword: false
    # Entra object IDs, not email addresses; direct assignments need no group licence.
    users:
      portfolio-owner: 13d45074-e2b1-4c98-9c95-e246f2abb575
    credentialValidityDays: 180
    allowAccountLinking: true

# Central testing service. Cloud dependencies are ASO-owned, not bootstrap inputs.
testkube:
  azure:
    location: uksouth
    storageResourceGroup: kubernetes
  retentionDays: 14

# Free delivery analytics; each cluster uses its local PostgreSQL and Grafana.
devlake:
  enabled: true
  credentialValidityDays: 180
  users:
    portfolio-owner: 13d45074-e2b1-4c98-9c95-e246f2abb575
  # One project/webhook per service/environment. Empty until a real delivery
  # boundary is selected; never classify management/bootstrap syncs as production.
  projects: {}
