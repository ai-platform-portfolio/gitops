cluster:
  name: management
  role: management

git:
  repository: https://github.com/ai-platform-portfolio/gitops.git
  revision: main

# Filled by scripts/cluster.py from Terraform outputs and authenticated context.
# Tenant/account context is supplied at runtime, not checked into values.
runtime: {}

# Prefix credentials for private release charts; Argo reuses its bootstrap identity.
argocd:
  onboarding:
    enabled: true
    # Azure profiles require the shared server and Atlas binding to be ready.
    profiles: [previews]
    databaseBackends:
      previews: cnpg
      environments: azure
    dependencies:
      storageResourceGroup: kubernetes
      location: uksouth
      model:
        deployment: chat
        project: management
        resourceGroup: rg-management
      telemetryEndpoint: http://opentelemetry-collector.opentelemetry.svc.cluster.local:4318
    chartRepository: https://github.com/ai-platform-portfolio/application-helm-chart.git
    chartRevision: 67cbdf5811ad66263fded8c60d1531bc4ed3acd7

  registry:
    name: localacrk8s

  # Existing all-repository App; its private key stays in Key Vault/ESO.
  github:
    appId: "5471830"
    installationId: "175270905"
    privateKeyRemoteKey: ai-platform-clusters-pem-key

# Shared preview TLS stays with the Gateway; apps attach exact-host routes.
gateway:
  private:
    enabled: true
    # Existing Foundry delegated subnet; shared ingress policy, not an app ACL.
    sourceRanges: [10.61.0.0/24]
    hostname: 'otel.internal.{{ .Values.runtime.DNS_ZONE }}'
    clusterIssuer: letsencrypt-azuredns

  preview:
    enabled: true
    hostname: '*.previews.{{ .Values.runtime.DNS_ZONE }}'
    listenerName: preview-https
    certificateSecret: preview-tls
    clusterIssuer: letsencrypt-azuredns

# Existing retained enterprise application; only public SAML metadata is fetched.
sonarqube:
  saml:
    applicationId: api://e0c91577-522a-42b9-9e55-878e147d5db9
    metadataAppId: e0c91577-522a-42b9-9e55-878e147d5db9

# Shared management-cluster orchestration. Maps contain native Argo specifications.
events:
  enabled: true
  github:
    enabled: true
    organization: ai-platform-portfolio
    signingSecretRemoteKey: cluster-github-webhook-secret
    refreshImage: registry.k8s.io/kubectl:v1.36.5@sha256:0667e3f3e6ef435d7cd4c16684244703ebd67314c17511c2a9f87ea44f6cdf6b
  sources: {}
  sensors: {}

clusterOnboarding:
  enabled: true
  # Successful applies must match this repo and clusters/<cluster.name>.
  repository: ai-platform-portfolio/cluster-deployments
  image: localacrk8s.azurecr.io/portfolio/cluster-onboarding@sha256:45fae1c039983cd446e5fd61a84cf1043dad97473052a9ad2052ad4c74aa22e9
  vaultResourceGroup: kubernetes

# Address inputs for staged policies only; NetworkPolicies are currently excluded.
# Empty lists do not enforce egress denial in this deployment.
holmes:
  enabled: true
  model: azure/chat
  modelApiVersion: "2025-04-01-preview"
  modelCidrs: []
  apiCidrs: []
  entraCidrs: []

  azure:
    location: uksouth
    foundryResourceGroupName: rg-management

# Package choices live in GitOps, not Terraform/tfvars. Atlantis requires the
# dedicated App installation and Key Vault credentials before this PR merges.
atlantis:
  enabled: true

  github_app_id: "5471830"
  github_app_slug: ai-platform-clusters
  github_team: platform
  repositories:
    - github.com/ai-platform-portfolio/cluster-deployments

  azure:
    location: uksouth
    # ASO creates this package-owned group; do not select an existing/shared RG.
    identity_resource_group_name: rg-{{ .Values.cluster.name }}-atlantis
    # Map approved existing state/deployment targets to built-in Azure role names.
    # Example entries are documented in packages/atlantis/README.md.
    role_assignments:
      state:
        scope: storage_account
        resource_group_name: claudeaiportfolio
        storage_account_name: localtfsa
        role_definition_name: Storage Blob Data Contributor

      deployment:
        scope: subscription
        role_definition_name: Contributor

      delegation:
        scope: subscription
        role_definition_name: Role Based Access Control Administrator

      api-allowlist:
        scope: key_vault
        resource_group_name: kubernetes
        key_vault_name: localdevenv
        role_definition_name: Key Vault Secrets User


# Portfolio portal: native Entra identity and an immutable image are required.
backstage:
  enabled: true
  clusterRequests:
    enabled: true
  image: localacrk8s.azurecr.io/portfolio/backstage@sha256:a844cdab82c4cc995a43d532bc110475cef17a9ee2010b361f0b73a915e66602
  imagePullSecrets: []
  credentialValidityDays: 180
  users:
    portfolio-owner:
      objectId: 13d45074-e2b1-4c98-9c95-e246f2abb575
      displayName: Michaela Links
      memberOf: [platform-team]
  egress:
    # GitHub /meta API IPv4 ranges, retrieved 2026-10-25. Refresh on change.
    - to:
        - ipBlock: {cidr: 192.30.252.0/22}
        - ipBlock: {cidr: 185.199.108.0/22}
        - ipBlock: {cidr: 140.82.112.0/20}
        - ipBlock: {cidr: 143.55.64.0/20}
        - ipBlock: {cidr: 20.201.28.148/32}
        - ipBlock: {cidr: 20.205.243.168/32}
        - ipBlock: {cidr: 20.87.245.6/32}
        - ipBlock: {cidr: 4.237.22.34/32}
        - ipBlock: {cidr: 4.228.31.149/32}
        - ipBlock: {cidr: 20.207.73.85/32}
        - ipBlock: {cidr: 20.27.177.116/32}
        - ipBlock: {cidr: 20.200.245.245/32}
        - ipBlock: {cidr: 20.175.192.149/32}
        - ipBlock: {cidr: 20.233.83.146/32}
        - ipBlock: {cidr: 20.29.134.17/32}
        - ipBlock: {cidr: 20.199.39.228/32}
        - ipBlock: {cidr: 20.217.135.0/32}
        - ipBlock: {cidr: 4.225.11.201/32}
        - ipBlock: {cidr: 20.250.119.72/32}
        - ipBlock: {cidr: 4.208.26.200/32}
        - ipBlock: {cidr: 20.26.156.210/32}
        - ipBlock: {cidr: 172.182.252.137/32}
        - ipBlock: {cidr: 4.249.131.166/32}
        - ipBlock: {cidr: 48.202.248.39/32}
        - ipBlock: {cidr: 48.204.201.2/32}
      ports:
        - {protocol: TCP, port: 443}

# Shared Redis stays cluster-local; client identities come from dedicated certificates.
redis:
  enabled: true
  image: docker.io/library/redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
  maxmemory: 256mb
  storage: 8Gi
  storageClass: managed-csi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

# Native Microsoft sign-in, owned by each cluster's AzureAD provider.
langfuse:
  redis:
    useShared: true

  bootstrap:
    organization: platform
    project: agents

  sso:
    enabled: true
    # Keep recovery login until the profile email and browser SSO are verified.
    disableUsernamePassword: false
    # Entra object IDs, not email addresses; direct assignments need no group licence.
    users:
      portfolio-owner: 13d45074-e2b1-4c98-9c95-e246f2abb575
    credentialValidityDays: 180
    allowAccountLinking: true

# Central testing service. Cloud dependencies are ASO-owned, not bootstrap inputs.
testkube:
  azure:
    location: uksouth
    storageResourceGroup: kubernetes
  retentionDays: 14

# Free delivery analytics; each cluster uses its local PostgreSQL and Grafana.
devlake:
  enabled: true
  credentialValidityDays: 180
  users:
    portfolio-owner: 13d45074-e2b1-4c98-9c95-e246f2abb575
  # One project/webhook per service/environment. Empty until a real delivery
  # boundary is selected; never classify management/bootstrap syncs as production.
  projects: {}

# Approved extra PostgreSQL access rules go before the terminal reject-all rule.
# Application registrations and deployment values live outside this chart.
postgres:
  # Operator-controlled PITR capacity; disabled until a specific restore is requested.
  recovery:
    enabled: false
    name: ""
    pointInTimeUTC: ""
    network:
      resourceGroup: ""
      virtualNetwork: ""
      subnet: ""
      dnsResourceGroup: ""
      privateDnsZone: privatelink.postgres.database.azure.com
    administrators: {}

  additionalHba:
    # Only Atlas can map its fixed client identity to generated migration logins.
    - hostssl samerole /^app_[a-z0-9_]+_migrator$ all cert map=atlas_clients
    # Runtime certificates must identify the exact login; no shared runtime key.
    - hostssl samerole /^app_[a-z0-9_]+_app$ all cert

# The management-cluster Kargo package grants Entra users explicit access.
kargo:
  location: uksouth
  registryResourceGroup: kubernetes
  admins:
    portfolio-owner: 13d45074-e2b1-4c98-9c95-e246f2abb575

# One shared Atlas control-plane identity administers SQL on the Terraform-owned
# Flexible Server. Application identities and databases remain chart-owned.
atlas:
  azurePostgres:
    # Enable after provisioning the Terraform-owned server for persistent environments.
    enabled: false
    serverName: pg-ai-platform-portfolio-management
    serverResourceGroup: rg-management
    identityName: id-atlas-postgres-management
    identityResourceGroup: rg-management
    location: uksouth

# Internal AI gateway; provider access and task selection are configured separately.
litellm:
  enabled: true
  modelList: []
  image:
    repository: ghcr.io/berriai/litellm
    tag: v1.109.1@sha256:11175975a3093e05e92faee2fe2fe3412a3ae2fcaa849eb0fe25d5f0d8bcb2e9
  azure:
    enabled: true # Dedicated gateway provider identity; existing Azure chat deployment.
    # Reuse the existing account deployment/version, never the project proxy.
    apiVersion: "2025-04-01-preview"
    chat: {deployment: chat, baseModel: gpt-6.1-sol-2026-09-29}
    embedding: {deployment: embedding, baseModel: text-embedding-3-small}
  google:
    enabled: true # Gemini only; existing federation metadata gates rendering.
    location: eu
    gemini: gemini-3.8-flash
  bedrock:
    enabled: false # Await AWS account access and live provider acceptance; retain EU wiring.
    region: eu-west-3
    claude: eu.anthropic.claude-sonnet-5-5
  access:
    enabled: true # Existing private Gateway; inference paths only.
    hostname: 'models.internal.{{ .Values.runtime.DNS_ZONE }}'
    policies:
      bounded-agent: &boundedAgent
        # Initial testing tier; aggregate allowance per stable consumer.
        maxBudget: 10 # USD per budgetDuration across all capability keys.
        budgetDuration: 30d
        rpm: 20
        tpm: 50000
        parallel: 2
        capabilities:
          default: {model: reasoning, routes: [/v1/responses]}
          coding: {model: coding, routes: [/v1/responses]}
          embedding: {model: embedding, version: "1", routes: [/v1/embeddings]}
      bounded-reasoning-coding:
        <<: *boundedAgent
        capabilities:
          default: {model: reasoning, routes: [/v1/responses]}
          coding: {model: claude, routes: [/v1/responses]}
          embedding: {model: embedding, version: "1", routes: [/v1/embeddings]}
      bounded-claude:
        <<: *boundedAgent
        capabilities:
          default: {model: claude, routes: [/v1/responses]}
          coding: {model: claude, routes: [/v1/responses]}
          embedding: {model: embedding, version: "1", routes: [/v1/embeddings]}
      bounded-gemini:
        <<: *boundedAgent
        capabilities:
          default: {model: gemini, routes: [/v1/responses]}
          coding: {model: gemini, routes: [/v1/responses]}
          embedding: {model: embedding, version: "1", routes: [/v1/embeddings]}
      documents:
        # Reusable document-processing tier, independently accounted per generated consumer.
        maxBudget: 5 # USD per budgetDuration, not a shared application allowance.
        budgetDuration: 30d
        rpm: 12
        tpm: 50000
        parallel: 2
        capabilities:
          default:
            model: chat
            routes: [/v1/chat/completions]

  accounting:
    storageResourceGroup: kubernetes
    # Native tools, pinned independently; PostgreSQL matches the CNPG major.
    postgresImage: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:48a0038fdd9672d12853d5300666b2592f97f9d34a993ea42e3ecb5a9a5e43e3

  keyVault:
    # Reuse the existing vault selected by runtime.AZURE_KEY_VAULT_URI.
    resourceGroup: kubernetes
    identityLocation: uksouth
