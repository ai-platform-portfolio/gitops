apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: workload-cluster-request
  title: Request a workload AKS cluster
  description: Propose a reviewed AKS and Fleet deployment for Atlantis.
spec:
  owner: group:default/platform-team
  type: infrastructure

  parameters:
    - title: Cluster identity
      required: [name, issue, kubernetesVersion]
      properties:
        name:
          title: Cluster name
          type: string
          pattern: '^aks-[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 40
          description: Unique AKS name. Existing clusters require a separate migration review.
        issue:
          title: Linear issue
          type: string
          pattern: '^AI-[0-9]+$'
        kubernetesVersion:
          title: AKS Kubernetes version
          type: string
          pattern: '^1\\.[0-9]{2}(\\.[0-9]+)?$'

    - title: Network and access
      required: [location, networkCidr, systemSubnetCidr, applicationSubnetCidr, adminGroupObjectId, apiAllowlistSecret]
      properties:
        location:
          title: Azure region
          type: string
          enum: [uksouth, ukwest]
        networkCidr:
          title: Virtual network CIDR
          type: string
          pattern: '^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
        systemSubnetCidr:
          title: System subnet CIDR
          type: string
          pattern: '^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
        applicationSubnetCidr:
          title: Application subnet CIDR
          type: string
          pattern: '^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
        adminGroupObjectId:
          title: Existing Entra AKS administrator group object ID
          type: string
          pattern: '^[0-9a-fA-F-]{36}$'
        apiAllowlistSecret:
          title: Existing Key Vault API allowlist secret name
          type: string
          pattern: '^[a-zA-Z0-9-]+$'
          description: JSON CIDR array in the platform vault; include the deployment runner and management Argo egress IPs.

    - title: Approved foundations
      required: [stateResourceGroup, stateAccount, stateContainer, keyVaultResourceGroup, keyVaultName, managementVnetName, managementVnetResourceGroup, registryName, registryResourceGroup]
      properties:
        stateResourceGroup:
          title: State resource group
          type: string
          pattern: '^[a-zA-Z0-9_.()-]{1,90}$'
        stateAccount:
          title: Existing state storage account
          type: string
          pattern: '^[a-z0-9]{3,24}$'
        stateContainer:
          title: Existing state container
          type: string
          pattern: '^[a-z0-9-]+$'
        keyVaultResourceGroup:
          title: Key Vault resource group
          type: string
          pattern: '^[a-zA-Z0-9_.()-]{1,90}$'
        keyVaultName:
          title: Existing platform Key Vault
          type: string
          pattern: '^[a-zA-Z0-9-]{3,24}$'
        managementVnetName:
          title: Management virtual network
          type: string
          pattern: '^[a-zA-Z0-9_.-]{2,64}$'
        managementVnetResourceGroup:
          title: Management network resource group
          type: string
          pattern: '^[a-zA-Z0-9_.()-]{1,90}$'
        registryName:
          title: Existing container registry
          type: string
          pattern: '^[a-zA-Z0-9]{5,50}$'
        registryResourceGroup:
          title: Container registry resource group
          type: string
          pattern: '^[a-zA-Z0-9_.()-]{1,90}$'
        fleetId:
          title: Existing Fleet ARM ID
          type: string
          pattern: '^(/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[a-zA-Z0-9_.()-]+/providers/Microsoft.ContainerService/fleets/[a-zA-Z0-9-]+)?$'
          description: Leave blank until the management Fleet PR is deployed.

    - title: Node pool sizing
      required: [systemVmSize, platformVmSize, servicesVmSize]
      properties:
        systemVmSize:
          title: System node VM size
          type: string
          pattern: '^Standard_D4[a-z]*_v[0-9]+$'
          description: One node; allow one more node of this VM family for upgrade surge.
        platformVmSize:
          title: Platform application node VM size
          type: string
          pattern: '^Standard_D4[a-z]*_v[0-9]+$'
          description: One node; hosts workloads pinned to agentpool=platform.
        servicesVmSize:
          title: Services application node VM size
          type: string
          pattern: '^Standard_D4[a-z]*_v[0-9]+$'
          description: One node; check its family quota and upgrade surge independently.

  steps:
    - id: fetch
      name: Generate pinned cluster root
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          location: ${{ parameters.location }}
          kubernetesVersion: ${{ parameters.kubernetesVersion }}
          networkCidr: ${{ parameters.networkCidr }}
          systemSubnetCidr: ${{ parameters.systemSubnetCidr }}
          applicationSubnetCidr: ${{ parameters.applicationSubnetCidr }}
          adminGroupObjectId: ${{ parameters.adminGroupObjectId }}
          apiAllowlistSecret: ${{ parameters.apiAllowlistSecret }}
          stateResourceGroup: ${{ parameters.stateResourceGroup }}
          stateAccount: ${{ parameters.stateAccount }}
          stateContainer: ${{ parameters.stateContainer }}
          keyVaultResourceGroup: ${{ parameters.keyVaultResourceGroup }}
          keyVaultName: ${{ parameters.keyVaultName }}
          managementVnetName: ${{ parameters.managementVnetName }}
          managementVnetResourceGroup: ${{ parameters.managementVnetResourceGroup }}
          registryName: ${{ parameters.registryName }}
          registryResourceGroup: ${{ parameters.registryResourceGroup }}
          fleetId: ${{ parameters.fleetId }}
          systemVmSize: ${{ parameters.systemVmSize }}
          platformVmSize: ${{ parameters.platformVmSize }}
          servicesVmSize: ${{ parameters.servicesVmSize }}
        targetPath: infrastructure

    - id: profile
      name: Generate GitOps workload profile
      action: fetch:template
      input:
        url: ./profile
        targetPath: gitops-profile
        values:
          name: ${{ parameters.name }}
          location: ${{ parameters.location }}
          issue: ${{ parameters.issue }}

    - id: proposeInfrastructure
      name: Open infrastructure review
      action: publish:github:pull-request
      input:
        repoUrl: ${{ globals.clusterRepoUrl }}
        branchName: backstage/${{ parameters.issue | lower }}-${{ parameters.name }}
        title: '${{ parameters.issue }} Add workload cluster ${{ parameters.name }}'
        description: 'Tracks ${{ parameters.issue }}. Review CIDRs, quota and surge headroom, Azure roles, API reachability, Fleet ownership, and the Terraform plan before applying.'
        update: false
        sourcePath: infrastructure
        targetPath: clusters/${{ parameters.name }}

    - id: proposePlatform
      name: Open GitOps platform review
      action: publish:github:pull-request
      input:
        repoUrl: ${{ globals.gitopsRepoUrl }}
        branchName: backstage/${{ parameters.issue | lower }}-${{ parameters.name }}-platform
        title: '${{ parameters.issue }} Add GitOps profile for ${{ parameters.name }}'
        description: 'Tracks ${{ parameters.issue }}. Merge after the cluster Terraform apply; management Argo will then reconcile the workload platform.'
        update: false
        sourcePath: gitops-profile
        targetPath: helm_chart/platform/clusters/${{ parameters.name }}

  output:
    links:
      - title: Review AKS and Fleet request
        url: ${{ steps.proposeInfrastructure.output.remoteUrl }}
      - title: Review GitOps platform profile
        url: ${{ steps.proposePlatform.output.remoteUrl }}
