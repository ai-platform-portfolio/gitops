apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 10m
  releaseName: langfuse
  chart:
    spec:
      chart: langfuse
      version: 2.1.4
      sourceRef:
        kind: HelmRepository
        name: langfuse
  values:
    langfuse:
      nextauth:
        url: https://langfuse.dev.michaelalinks.com
    clickhouse:
      keeper:
        replicas: 1
  dependsOn:
  - name: clickhouse-operator
