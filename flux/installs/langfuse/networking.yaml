apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse
  namespace: langfuse
spec:
  hostnames:
  - langfuse.${DNS_ZONE}
  parentRefs:
  - name: public
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - name: langfuse-web
      port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: langfuse
spec:
  hostnames:
  - langfuse.${DNS_ZONE}
  parentRefs:
  - name: public
    namespace: envoy-gateway-system
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
