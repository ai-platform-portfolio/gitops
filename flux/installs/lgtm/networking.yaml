apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: lgtm
spec:
  hostnames:
  - grafana.${DNS_ZONE}
  parentRefs:
  - name: public
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - name: grafana
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: lgtm
spec:
  hostnames:
  - grafana.${DNS_ZONE}
  parentRefs:
  - name: public
    namespace: envoy-gateway-system
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
