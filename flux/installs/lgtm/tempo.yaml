apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: lgtm
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: tempo
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  values:
    podLabels:
      azure.workload.identity/use: 'true'
    serviceAccount:
      create: false
      name: lgtm
    persistence:
      enabled: true
    tempo:
      storage:
        trace:
          backend: azure
          azure:
            container_name: tempo-traces
            storage_account_name: ${AZURE_STORAGE_ACCOUNT}
            use_federated_token: true
  releaseName: tempo
