apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: lgtm
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: loki
      version: 18.15.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  values:
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      podLabels:
        azure.workload.identity/use: 'true'
      schemaConfig:
        configs:
        - from: '2026-01-01'
          store: tsdb
          object_store: azure
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
      storage:
        type: azure
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
        azure:
          accountName: ${AZURE_STORAGE_ACCOUNT}
          useFederatedToken: true
    serviceAccount:
      create: false
      name: lgtm
    singleBinary:
      replicas: 1
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    gateway:
      serviceAccount:
        create: false
    lokiCanary:
      serviceAccount:
        create: false
  releaseName: loki
