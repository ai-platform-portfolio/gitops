apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: lgtm
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: mimir-distributed
      version: 6.2.1
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    global:
      podLabels:
        azure.workload.identity/use: 'true'
    serviceAccount:
      create: false
      name: lgtm
    minio:
      enabled: false
    kafka:
      enabled: false
    mimir:
      structuredConfig:
        multitenancy_enabled: false
        ingest_storage:
          enabled: false
        ingester:
          push_grpc_method_enabled: true
          ring:
            replication_factor: 1
        common:
          storage:
            backend: azure
            azure:
              account_name: ${AZURE_STORAGE_ACCOUNT}
        blocks_storage:
          backend: azure
          azure:
            container_name: mimir-blocks
        ruler_storage:
          backend: azure
          azure:
            container_name: mimir-ruler
        alertmanager_storage:
          backend: azure
          azure:
            container_name: mimir-alertmanager
    ingester:
      replicas: 1
      zoneAwareReplication:
        enabled: false
    store_gateway:
      zoneAwareReplication:
        enabled: false
    querier:
      replicas: 1
    query_frontend:
      replicas: 1
    overrides_exporter:
      replicas: 1
    query_scheduler:
      replicas: 1
  releaseName: mimir
