apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-azuread-app
  namespace: lgtm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: grafana-azuread-app
  data:
  - secretKey: GF_AUTH_AZUREAD_CLIENT_ID
    remoteRef:
      key: grafana-sso-client-id
  - secretKey: GF_AUTH_AZUREAD_CLIENT_SECRET
    remoteRef:
      key: grafana-sso-client-secret
