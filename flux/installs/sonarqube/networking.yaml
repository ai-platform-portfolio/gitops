apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  hostnames:
  - sonarqube.${DNS_ZONE}
  parentRefs:
  - name: public
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - name: sonarqube
      port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: sonarqube
spec:
  hostnames:
  - sonarqube.${DNS_ZONE}
  parentRefs:
  - name: public
    namespace: envoy-gateway-system
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
