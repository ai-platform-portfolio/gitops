apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  interval: 10m
  chart:
    spec:
      chart: clickhouse-cluster-helm
      version: 0.0.8
      sourceRef:
        kind: HelmRepository
        name: clickhouse-operator
  dependsOn:
  - name: clickhouse-operator
  values:
    clickhouse:
      meta:
        name: clickhouse
      spec:
        replicas: 1
    keeper:
      meta:
        name: clickhouse
      spec:
        replicas: 1
