apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: platform-pooler
  namespace: postgres
spec:
  cluster:
    name: platform
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "500"
      default_pool_size: "20"
      reserve_pool_size: "5"
      max_db_connections: "80"
      client_tls_sslmode: require
  template:
    metadata:
      labels:
        app: platform-pooler
    spec:
      containers:
      - name: pgbouncer
        image: ghcr.io/cloudnative-pg/pgbouncer:1.26.0
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: platform-pooler
            topologyKey: kubernetes.io/hostname
