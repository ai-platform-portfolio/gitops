apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: platform-daily
  namespace: postgres
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: cluster
  cluster:
    name: platform
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
