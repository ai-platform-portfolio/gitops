apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 10m
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
  values:
    provider:
      name: azure-dns
    sources:
    - gateway-httproute
    domainFilters:
    - ${DNS_ZONE}
    policy: sync
    txtOwnerId: aks-dev
    txtPrefix: external-dns-
    extraArgs:
    - --gateway-namespace=envoy-gateway-system
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: ${AZURE_DNS_CLIENT_ID}
      name: external-dns
    podLabels:
      azure.workload.identity/use: 'true'
    extraVolumes:
    - name: azure-config
      configMap:
        name: external-dns-azure
    extraVolumeMounts:
    - name: azure-config
      mountPath: /etc/kubernetes
      readOnly: true
