apiVersion: v1
kind: ConfigMap
metadata:
  name: external-dns-azure
  namespace: external-dns
data:
  azure.json: |
    {
      "tenantId": "${AZURE_TENANT_ID}",
      "subscriptionId": "${AZURE_SUBSCRIPTION_ID}",
      "resourceGroup": "${AZURE_DNS_RESOURCE_GROUP}",
      "useWorkloadIdentityExtension": true
    }
