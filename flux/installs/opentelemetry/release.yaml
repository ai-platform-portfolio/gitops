apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry
  namespace: opentelemetry
spec:
  interval: 10m
  releaseName: opentelemetry-collector
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.175.1
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
  values:
    mode: deployment
    image:
      repository: otel/opentelemetry-collector-contrib
    command:
      name: otelcol-contrib
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    ports:
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
    config:
      receivers:
        jaeger: null
        zipkin: null
        prometheus: null
      exporters:
        debug: null
        otlp_grpc/tempo:
          endpoint: tempo.lgtm.svc.cluster.local:4317
          tls:
            insecure: true
        otlp_http/loki:
          endpoint: http://loki-gateway.lgtm.svc.cluster.local/otlp
        prometheusremotewrite/mimir:
          endpoint: http://mimir-gateway.lgtm.svc.cluster.local/api/v1/push
      service:
        pipelines:
          traces:
            receivers:
            - otlp
            exporters:
            - otlp_grpc/tempo
          logs:
            receivers:
            - otlp
            exporters:
            - otlp_http/loki
          metrics:
            receivers:
            - otlp
            exporters:
            - prometheusremotewrite/mimir
