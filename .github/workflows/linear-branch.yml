name: Linear branch check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions: {}
jobs:
  linear-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a Linear issue identifier in the branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ ! "$BRANCH_NAME" =~ (^|/)[Aa][Ii]-[1-9][0-9]*($|[-/]) ]]; then
            printf '%s\n' '::error::Branch must include a Linear issue identifier, for example ai-28-postgres.'
            exit 1
          fi
