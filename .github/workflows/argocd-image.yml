name: Argo controller backport

on:
  pull_request:
    paths: ['bootstrap/argocd-image/**', '.github/workflows/argocd-image.yml']
  push:
    branches: [main]
    paths: ['bootstrap/argocd-image/**', '.github/workflows/argocd-image.yml']

permissions:
  contents: read
  id-token: write

jobs:
  image:
    uses: ai-platform-portfolio/ops-shared/.github/workflows/docker.yml@dc2eea27bc3741d07906b8a1c519b929848ddac5
    with:
      image: platform/argocd
      context: bootstrap/argocd-image
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      publish-preview: true
      scan: true
      artifact-name: image-argocd
      tag: ${{ github.event_name == 'pull_request' && format('preview-argocd-v3.5.9-ai292-{0}', github.event.pull_request.head.sha) || format('argocd-v3.5.9-ai292-{0}', github.sha) }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
