name: Validate GitOps
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/validate.py --cache /tmp/gitops-validation
      - name: Validate OpenTelemetry configuration
        run: >-
          docker run --rm
          -e MY_POD_IP=127.0.0.1
          -v /tmp/gitops-validation/otel-config.yaml:/etc/otelcol/config.yaml:ro
          otel/opentelemetry-collector-contrib:0.161.0
          validate --config=/etc/otelcol/config.yaml
