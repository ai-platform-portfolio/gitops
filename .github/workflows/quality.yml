name: Engineering quality
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    uses: ai-platform-portfolio/ops-shared/.github/workflows/workflow-lint.yml@abdaffab6c347bc2a1e904908b20b9a2e786db68
  policy:
    if: github.event_name == 'pull_request'
    uses: ai-platform-portfolio/ops-shared/.github/workflows/quality.yml@abdaffab6c347bc2a1e904908b20b9a2e786db68
    permissions:
      contents: read
      pull-requests: read
    with:
      policy-file: engineering.yaml
  quality:
    if: always()
    needs: [lint, policy]
    runs-on: ubuntu-latest
    steps:
      - name: Require workflow lint and PR policy checks
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$LINT_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$POLICY_RESULT" = success
          fi
