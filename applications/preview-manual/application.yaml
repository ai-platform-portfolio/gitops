# Register explicitly after deployment approval; platform bootstrap does not load this file.
# Manual sync and no cascade finalizer until ordered SQL cleanup is proven.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: preview-manual
  namespace: argocd

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: preview-manual

  sources:
    - repoURL: https://github.com/ai-platform-portfolio/application-helm-chart.git
      targetRevision: 6a77da74d6caea8f0730df8b4b699f83c43d594f
      path: .
      helm:
        releaseName: preview
        valueFiles: [$application/deploy/values.yaml]
        valuesObject:
          hosts:
            web: {hostname: preview-manual.dev.michaelalinks.com}

    # A values-only source: Argo does not render the application repository.
    - repoURL: https://github.com/ai-platform-portfolio/preview-environments.git
      targetRevision: d847a991edb655dbe6b37bfaf1766fa1303d82fa
      ref: application

    - repoURL: https://github.com/ai-platform-portfolio/gitops.git
      targetRevision: main
      path: applications/preview-manual
      directory:
        include: credentials.yaml

  syncPolicy:
    retry:
      limit: 3
      backoff: {duration: 10s, factor: 2, maxDuration: 1m}
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
