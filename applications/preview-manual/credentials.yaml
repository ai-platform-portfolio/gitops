# Trusted platform credential configuration for this application registration.
platform:
  credentials:
    passwords:
      preview-manual-migrator:
        metadata:
          namespace: postgres
          annotations:
            argocd.argoproj.io/sync-wave: '-35'
        spec:
          length: 48
          digits: 8
          symbols: 0
          allowRepeat: true
      preview-manual-runtime:
        metadata:
          namespace: postgres
          annotations:
            argocd.argoproj.io/sync-wave: '-35'
        spec:
          length: 48
          digits: 8
          symbols: 0
          allowRepeat: true
    externalSecrets:
      preview-manual-migrator:
        metadata:
          namespace: postgres
          annotations:
            argocd.argoproj.io/sync-wave: '-35'
        spec:
          refreshPolicy: CreatedOnce
          target:
            name: preview-manual-migrator
            creationPolicy: Orphan
            immutable: true
          dataFrom:
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: preview-manual-migrator
      preview-manual-migrator-copy:
        metadata:
          name: preview-manual-migrator
          namespace: atlas-system
          annotations:
            argocd.argoproj.io/sync-wave: '-30'
        spec:
          refreshInterval: 1m
          secretStoreRef:
            name: atlas-postgres
            kind: SecretStore
          target:
            name: preview-manual-migrator
          data:
          - secretKey: password
            remoteRef:
              key: preview-manual-migrator
              property: password
      preview-manual-runtime:
        metadata:
          namespace: postgres
          annotations:
            argocd.argoproj.io/sync-wave: '-35'
        spec:
          refreshPolicy: CreatedOnce
          target:
            name: preview-manual-runtime
            creationPolicy: Orphan
            immutable: true
          dataFrom:
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: preview-manual-runtime
      preview-manual-runtime-copy:
        metadata:
          name: preview-manual-runtime
          namespace: atlas-system
          annotations:
            argocd.argoproj.io/sync-wave: '-30'
        spec:
          refreshInterval: 1m
          secretStoreRef:
            name: atlas-postgres
            kind: SecretStore
          target:
            name: preview-manual-runtime
          data:
          - secretKey: password
            remoteRef:
              key: preview-manual-runtime
              property: password
      preview-database:
        metadata:
          namespace: preview-manual
          annotations:
            argocd.argoproj.io/sync-wave: '-30'
        spec:
          refreshInterval: 1m
          secretStoreRef:
            name: preview-postgres
            kind: SecretStore
          target:
            name: preview-database
            template:
              engineVersion: v2
              data:
                url: postgres://preview_manual_app:{{ .password }}@platform-rw.postgres.svc.cluster.local:5432/preview_manual?sslmode=verify-full&sslrootcert=/etc/postgres/ca.crt
                ca.crt: '{{ index . "ca.crt" }}'
          data:
          - secretKey: password
            remoteRef:
              key: preview-manual-runtime
              property: password
          - secretKey: ca.crt
            remoteRef:
              key: platform-ca
              property: ca.crt
    secretStores:
      preview-postgres:
        metadata:
          namespace: preview-manual
          annotations:
            argocd.argoproj.io/sync-wave: '-33'
        spec:
          provider:
            kubernetes:
              remoteNamespace: postgres
              server:
                url: https://kubernetes.default.svc
                caProvider:
                  type: ConfigMap
                  name: kube-root-ca.crt
                  key: ca.crt
              auth:
                serviceAccount:
                  name: preview-secret-reader
    serviceAccounts:
      preview-secret-reader:
        metadata:
          namespace: preview-manual
          annotations:
            argocd.argoproj.io/sync-wave: '-34'
        automountServiceAccountToken: false
    roles:
      preview-manual-atlas-reader:
        metadata:
          namespace: postgres
          annotations:
            argocd.argoproj.io/sync-wave: '-34'
        rules:
        - apiGroups:
          - ''
          resources:
          - secrets
          resourceNames:
          - preview-manual-migrator
          - preview-manual-runtime
          verbs:
          - get
      preview-manual-runtime-reader:
        metadata:
          namespace: postgres
          annotations:
            argocd.argoproj.io/sync-wave: '-34'
        rules:
        - apiGroups:
          - ''
          resources:
          - secrets
          resourceNames:
          - preview-manual-runtime
          - platform-ca
          verbs:
          - get
    roleBindings:
      preview-manual-atlas-reader:
        metadata:
          namespace: postgres
          annotations:
            argocd.argoproj.io/sync-wave: '-34'
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: preview-manual-atlas-reader
        subjects:
        - kind: ServiceAccount
          name: atlas-secret-reader
          namespace: atlas-system
      preview-manual-runtime-reader:
        metadata:
          namespace: postgres
          annotations:
            argocd.argoproj.io/sync-wave: '-34'
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: preview-manual-runtime-reader
        subjects:
        - kind: ServiceAccount
          name: preview-secret-reader
          namespace: preview-manual
